<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>US Stock Cloud — 1000 US Stocks</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

.app{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

/* =====================================================
   GRID BUTTON + US STOCKS BRAND
===================================================== */

.stockBrand{
  position:absolute;
  top:10px;
  left:16px;
  z-index:50001;
  color:#fff;
  font-size:18px;
  line-height:30px;
  font-weight:900;
  letter-spacing:.4px;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 2px 10px rgba(255,255,255,.16);
}

.pageButton{
  position:absolute;
  top:9px;
  left:9px;
  width:30px;
  height:30px;
  z-index:50000;
  border-radius:50%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .22s ease,
    filter .22s ease,
    opacity .22s ease;
}

.pageButton:hover{
  transform:translateY(-2px) scale(1.08);
  filter:drop-shadow(0 5px 10px rgba(255,255,255,.22));
}

.pageButton:active{
  transform:translateY(0) scale(.88);
}

.gridIcon{
  width:14px;
  height:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2px;
  filter:drop-shadow(0 3px 6px rgba(255,255,255,.18));
  transition:
    transform .22s ease,
    filter .22s ease;
}

.pageButton:hover .gridIcon{
  transform:translateY(-1px);
  filter:drop-shadow(0 5px 9px rgba(255,255,255,.30));
}

.gridIcon span{
  display:block;
  width:100%;
  height:100%;
  border:1.2px solid #fff;
  background:#fff;
  border-radius:2px;
  box-shadow:0 1px 4px rgba(255,255,255,.10);
}

/* =====================================================
   PAGE MENU
===================================================== */

.pageMenu{
  position:absolute;
  top:auto;
  left:auto;
  right:10px;
  bottom:10px;
  height:40px;
  z-index:49000;

  display:flex;
  align-items:center;
  gap:6px;

  overflow-x:auto;
  overflow-y:hidden;

  opacity:0;
  pointer-events:none;

  justify-content:flex-end;

  transform:translateY(8px);

  transition:
    opacity .2s ease,
    transform .2s ease;

  scrollbar-width:none;
}

.pageMenu::-webkit-scrollbar{
  display:none;
}

.pageMenu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.pageItem{
  flex:0 0 auto;
  height:32px;
  padding:0 13px;
  border-radius:16px;
  border:1px solid #555b60;
  background:rgba(10,10,10,.9);
  color:#aeb4b9;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;

  display:flex;
  align-items:center;
  justify-content:center;
}

.pageItem.active{
  color:#fff;
  border-color:#999fa4;
  background:rgba(130,135,140,.17);
}

/* =====================================================
   stock CLOUD
===================================================== */

.cloud{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

/* =====================================================
   stock
===================================================== */

.stockCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

  z-index:10;
}

.stockCard.dragging{
  z-index:60000;
  cursor:grabbing;
}

.stockBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:calc(var(--size) * .012);

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%
    );

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.stockBody::after{
  content:"";

  position:absolute;
  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.stockLogo{
  width:44%;
  height:44%;

  min-width:0;
  min-height:0;

  max-width:none;
  max-height:none;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #72797f;

  padding:1px;
}

.stockSymbol{
  width:96%;
  margin-top:2px;

  text-align:center;

  color:#eee;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.105),
      20px
    );

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockPrice{
  width:96%;
  text-align:center;
  margin-top:1px;

  color:#c5cacf;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.070),
      16px
    );

  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockGain{
  margin-top:1px;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.068),
      16px
    );

  font-weight:900;
}

.up{
  color:#55dc91;
}

.down{
  color:#ff5965;
}

/* =====================================================
   POPUP
===================================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:100000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:10px;

  background:rgba(0,0,0,.20);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.overlay.show{
  display:flex;
}

.popup{
  position:relative;

  width:min(390px,95vw);

  max-height:
    calc(100dvh - 36px);

  overflow:auto;

  padding:12px 14px;

  border-radius:21px;

  border:
    1px solid
    rgba(135,142,149,.65);

  background:
    linear-gradient(
      145deg,
      rgba(31,33,35,.80),
      rgba(2,2,2,.64)
    );

  box-shadow:
    0 20px 55px
    rgba(0,0,0,.78);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  animation:
    popupIn .2s ease-out;
}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.close{
  position:absolute;

  top:7px;
  right:7px;

  width:30px;
  height:30px;

  border:0;
  border-radius:0;
  background:transparent;

  color:#ddd;

  font-size:22px;
  line-height:1;
}

.popupHead{
  display:flex;
  align-items:center;
  gap:9px;

  padding-right:34px;
  margin-bottom:6px;
}

.popupLogo{
  width:45px;
  height:45px;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #777e84;

  padding:3px;
}

.popupName{
  font-size:21px;
  font-weight:900;
  color:#fff;
}

.popupSymbol{
  margin-top:2px;

  color:#a0a7ad;

  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
}

.priceRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.favoriteStar{width:38px;height:38px;border:0;outline:0;background:transparent;color:#777;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;flex:0 0 auto;margin-top:-2px}
.favoriteStar svg{width:24px;height:24px;fill:transparent;stroke:currentColor;stroke-width:1.8;transition:.18s}
.favoriteStar:hover{background:rgba(255,255,255,.07);color:#fff}
.favoriteStar.active{color:#ffd84d}.favoriteStar.active svg{fill:currentColor}
.popupActions{display:flex;align-items:center;gap:2px;flex:0 0 auto;margin-top:-2px}
.popupAction{width:38px;height:38px;border:0;outline:0;background:transparent;color:#777;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;transition:.18s}
.popupAction svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.popupAction:hover{background:rgba(255,255,255,.07);color:#fff}
.popupPrice{
  font-size:31px;
  line-height:1.05;
  font-weight:900;
  color:#fff;
}

.popupGain{
  margin-top:3px;
  font-size:15px;
  font-weight:900;
}

.chart{
  width:100%;
  height:38px;

  margin-top:7px;

  border-radius:12px;

  border:
    1px solid
    rgba(135,142,149,.55);

  background:
    rgba(255,255,255,.035);

  color:#ddd;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:9px;

  font-size:11px;
  font-weight:900;
}

.chart svg{
  width:20px;
  height:20px;
}

.infoGrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:5px;

  margin-top:7px;
}

.info{
  min-height:47px;

  padding:6px 8px;

  border-radius:11px;

  background:
    rgba(255,255,255,.028);

  border:
    1px solid
    rgba(115,123,130,.30);
}

.label{
  margin-bottom:3px;

  color:#8f979d;

  font-size:10px;
  font-weight:800;

  text-transform:uppercase;
}

.value{
  color:#f0f1f2;

  font-size:13px;
  font-weight:900;

  word-break:break-word;
}

@media (max-width:520px){

  .popup{
    width:min(390px,92vw);
    max-height:calc(100dvh - 44px);
    padding:10px 11px;
    border-radius:16px;
  }

  .popupHead{
    gap:8px;
    margin-bottom:5px;
  }

  .popupLogo{
    width:42px;
    height:42px;
  }

  .popupName{
    font-size:20px;
  }

  .popupSymbol{
    font-size:12px;
  }

  .popupPrice{
    font-size:29px;
  }

  .popupGain{
    font-size:14px;
  }

  .chart{
    height:36px;
    margin-top:6px;
    font-size:12px;
  }

  .infoGrid{
    gap:4px;
    margin-top:6px;
  }

  .info{
    min-height:44px;
    padding:5px 7px;
  }

  .label{
    font-size:9px;
    margin-bottom:2px;
  }

  .value{
    font-size:12px;
  }
}


/* UPDATED MENU + SEARCH */
.searchButton{position:absolute;top:7px;right:8px;width:40px;height:40px;z-index:50002;border:0;outline:0;border-radius:50%;background:transparent;color:#ddd;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;backdrop-filter:none}
.searchButton:hover{background:rgba(255,255,255,.06)}
.searchButton svg{width:21px;height:21px}
.searchPanel{position:fixed;top:10px;right:50px;width:min(230px,34vw);height:38px;z-index:50003;display:flex;align-items:center;padding:0 12px;border:0;outline:0;border-radius:19px;background:rgba(0,0,0,.18);backdrop-filter:blur(14px);box-shadow:none}
.searchPanel.show{display:flex}.searchPanel input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:13px}.searchPanel input::placeholder{color:#777}

.searchResults.show{display:block}.searchResult{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}.searchResult img{width:30px;height:30px;border-radius:50%;background:#000}.searchResult b{font-size:12px}.searchResult span{margin-left:auto;font-size:11px;color:#999}
.pageButton{top:auto;left:auto;right:14px;bottom:30px;width:52px;height:52px;border:0;outline:0;background:transparent;backdrop-filter:none;border-radius:50%;z-index:50010;box-shadow:none}
.pageButton:hover{background:rgba(255,255,255,.06)}
.pageButton .gridIcon{width:22px;height:22px;gap:3px}
.pageMenu{position:fixed;inset:0;width:100vw;height:100dvh;z-index:50009;padding:72px 18px 90px;display:block;opacity:0;pointer-events:none;transform:none;background:rgba(0,0,0,.20);backdrop-filter:blur(18px);overflow:auto}
.pageMenu.show{opacity:1;pointer-events:auto;transform:none}.pageMenu::before{content:'Menu';display:block;font-size:28px;font-weight:900;margin-bottom:20px}
.menuList{display:flex;flex-direction:column;gap:2px;max-width:520px}
.menuItem{width:100%;min-height:48px;padding:0 12px;border:0;border-bottom:1px solid #202020;background:transparent;color:#aaa;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px;font-weight:800;cursor:pointer}
.menuItem:hover,.menuItem.active{color:#fff;background:rgba(255,255,255,.045)}
.menuItem .chevron{font-size:18px;color:#666;transition:transform .2s}.menuItem.active .chevron{color:#aaa;transform:rotate(90deg)}
.subMenu{display:none;padding:7px 0 10px 12px}.subMenu.show{display:block}

.subRow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}.subRow::-webkit-scrollbar{display:none}
.subToggle{flex:0 0 auto;padding:9px 13px;border:0;border-radius:18px;background:#151515;color:#999;font-size:11px;font-weight:800;cursor:pointer}.subToggle.active{background:#303030;color:#fff}
@media(max-width:600px){.searchPanel,.searchResults{width:190px}.searchPanel{right:48px}.searchResults{right:48px}}

.liveStatus{position:fixed;top:43px;left:16px;z-index:50002;display:flex;align-items:center;gap:6px;font-size:9px;font-weight:900;color:#777;letter-spacing:.4px;pointer-events:none}.liveDot{width:6px;height:6px;border-radius:50%;background:#555;box-shadow:0 0 0 transparent}.liveStatus.live{color:#55dc91}.liveStatus.live .liveDot{background:#55dc91;box-shadow:0 0 8px rgba(85,220,145,.8)}.liveStatus.error{color:#ff5965}.liveStatus.error .liveDot{background:#ff5965}
</style>
</head>

<body>

<div class="app">

  
<button id="searchButton" class="searchButton" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></button>

<script>

/* =====================================================
   CONFIG
===================================================== */

const TOTAL_STOCKS = 1000;

const STOCKS_PER_PAGE = 100;

const TOTAL_PAGES =
  Math.ceil(
    TOTAL_STOCKS /
    STOCKS_PER_PAGE
  );

const MIN_SIZE = 52;

const MAX_SIZE = 118;

const SAFE_TOP = 55;


/* =====================================================
   STATE
===================================================== */

let allStocks = [];

let visibleStocks = [];

let currentPage = 0;

let selectedStock = null;

let drag = null;

let socket = null;
let reconnectTimer = null;
let liveReconnectAttempt = 0;
const LIVE_REFRESH_MS = 15000;

let positions = new Map();

let nodes = new Map();

let stockMap = new Map();
let stockBySymbol = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:4
        }
      );

  return '$'+
    v.toLocaleString(
      'en-US',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return '$'+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return '$'+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return '$'+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return '$'+
      (v/1e3).toFixed(2)+
      'K';

  return '$'+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   stock SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.pow(
      g/100,
      .48
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}

let activeTimeFrame='1D';
function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  // US Stock Data does not provide 4H/1Y in the markets endpoint used here.
  // Use the current 24H value as the live fallback until a historical source is available.
  return Number(c.price_change_percentage_24h)||0;
}
function applyTimeFilter(name){
  if(!allStocks.length)return;

  }
  cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));

function refreshActiveTimeframe(){

}

/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  positions.clear();

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  visibleStocks.forEach(
    stock=>{

      const size=
        sizeFromGain(
          stock.price_change_percentage_24h
        );

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum=
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        stock.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}


/* =====================================================
   APPLY
===================================================== */

function applyPosition(id){

  const p=
    positions.get(id);

  const node=
    nodes.get(id);

  if(
    !p ||
    !node
  )
    return;

  node.card.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.card.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.card.style.setProperty(
    '--size',
    p.size+'px'
  );

  node.card.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

  const pulse=
    1+
    Math.sin(
      performance.now()*
      p.pulseSpeed+
      p.pulsePhase
    )*.035;

  node.card.style.setProperty(
    '--pulse',
    pulse.toFixed(4)
  );

}

  logo.loading='eager';
  logo.decoding='async';

  const symbol=
    document.createElement(
      'div'
    );

  symbol.className=
    'stockSymbol';

  symbol.textContent=
    stock.symbol.toUpperCase();

  const priceEl=
    document.createElement(
      'div'
    );

  priceEl.className=
    'stockPrice';

  priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=
    Number(
      stock.price_change_percentage_24h
    )||0;

  const gainEl=
    document.createElement(
      'div'
    );

  gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  gainEl.textContent=
    percent(gain);

  body.appendChild(logo);
  body.appendChild(symbol);
  body.appendChild(priceEl);
  body.appendChild(gainEl);

  card.appendChild(body);

  nodes.set(
    stock.id,
    {
      card:card,
      logo:logo,
      priceEl:priceEl,
      gainEl:gainEl
    }
  );

  enableDrag(
    card,
    stock.id
  );

  applyPosition(
    stock.id
  );

  return card;

}

function stockLogo(symbol){

}

function tradingViewLogo(symbol){
  const s=String(symbol||'').trim().toLowerCase();
  return 'https://s3-symbol-logo.tradingview.com/'+encodeURIComponent(s)+'--big.svg';
}

function logoCandidates(symbol){
  const s=String(symbol||'').trim().toUpperCase();
  const q='?v=20260928';
  return [
    'https://api.eulerpool.com/api/1/logo/ticker/'+encodeURIComponent(s)+q,
    'https://assets.parqet.com/logos/symbol/'+encodeURIComponent(s)+'?format=png&size=128',

  ];
}

function setReliableLogo(img,symbol){
  if(!img)return;
  const candidates=logoCandidates(symbol);
  let i=0;
  img.onerror=()=>{
    i++;
    if(i<candidates.length) img.src=candidates[i];
    else { img.onerror=null; img.src=fallbackLogo(symbol); }
  };
  img.src=candidates[0];
}

function fallbackLogo(symbol){
  const text=String(symbol||'?').slice(0,4).toUpperCase();
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="48" fill="#101010" stroke="#777"/>'+
    '<text x="50" y="55" text-anchor="middle" dominant-baseline="middle" fill="#eee" font-family="Arial" font-size="22" font-weight="700">'+text+'</text></svg>'
  );
}

async function fetchTradingViewStocks(){
  const body={
    filter:[
      {left:'type',operation:'equal',right:'stock'},
      {left:'exchange',operation:'in_range',right:['NASDAQ','NYSE','AMEX','ARCA']}
    ],
    options:{lang:'en'},markets:['america'],symbols:{query:{types:[]},tickers:[]},
    columns:['name','description','close','change','change_abs','volume','market_cap_basic','exchange','sector'],
    sort:{sortBy:'market_cap_basic',sortOrder:'desc'},range:[0,TOTAL_STOCKS]
  };
  const response=await fetch('https://scanner.tradingview.com/america/scan',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'
  });
  if(!response.ok) throw new Error('TradingView Scanner HTTP '+response.status);
  const json=await response.json();
  if(!json || !Array.isArray(json.data)) throw new Error('TradingView Scanner returned invalid data');
  return json;
}

function buildTradingViewStocks(json){
  const rows=Array.isArray(json&&json.data)?json.data:[], out=[], seen=new Set();
  rows.forEach(row=>{
    const full=String(row.s||''), symbol=(full.includes(':')?full.split(':').pop():full).toUpperCase(), d=Array.isArray(row.d)?row.d:[];
    if(!symbol||seen.has(symbol)) return;
    const current=Number(d[2]); if(!Number.isFinite(current)||current<=0) return;
    const change=Number(d[3]), volume=Number(d[5]), market=Number(d[6]);
    out.push({id:'us-'+symbol.replace(/[^A-Z0-9]/g,'-'),symbol,name:String(d[1]||d[0]||symbol),image:stockLogo(symbol),current_price:current,price_change_percentage_24h:Number.isFinite(change)?change:null,market_cap:Number.isFinite(market)?market:0,total_volume:Number.isFinite(volume)?volume:0,high_24h:null,low_24h:null,market_cap_rank:out.length+1,circulating_supply:null,total_supply:null,max_supply:null,ath:null,atl:null,price_change_percentage_1h_in_currency:null,price_change_percentage_7d_in_currency:null,price_change_percentage_30d_in_currency:null,sector:String(d[8]||''),exchange:String(d[7]||full.split(':')[0]||''),tv_symbol:full});
    seen.add(symbol);
  });
  return out.slice(0,TOTAL_STOCKS);
}

// Stable US stock universe/quote fallback. The public dataset explicitly supports
// browser CORS and returns up to 500 rows per request, so we load 2 pages = 1,000.
async function fetchStockApiPage(offset){
  const url='https://top-us-stock-tickers.zyhe.me/api/v2/tickers?collection=us&sort=market_cap&order=desc&limit=500&offset='+offset;
  const response=await fetch(url,{cache:'no-store',headers:{'Accept':'application/json'}});
  if(!response.ok) throw new Error('US Stock API HTTP '+response.status);
  const json=await response.json();
  if(!json||!Array.isArray(json.items)) throw new Error('US Stock API returned invalid data');
  return json;
}

function buildApiStocks(pages){
  const out=[],seen=new Set();
  pages.flatMap(x=>x.items||[]).forEach((d)=>{
    const symbol=String(d.symbol||'').trim().toUpperCase();
    if(!symbol||seen.has(symbol)) return;
    const price=Number(d.price), pct=Number(d.percent_change), cap=Number(d.market_cap), vol=Number(d.volume);
    out.push({
      id:'us-'+symbol.replace(/[^A-Z0-9]/g,'-'),symbol,
      name:String(d.name||symbol),image:stockLogo(symbol),
      current_price:Number.isFinite(price)&&price>0?price:null,
      price_change_percentage_24h:Number.isFinite(pct)?pct:null,
      market_cap:Number.isFinite(cap)?cap:0,total_volume:Number.isFinite(vol)?vol:0,
      high_24h:null,low_24h:null,market_cap_rank:out.length+1,
      circulating_supply:null,total_supply:null,max_supply:null,ath:null,atl:null,
      price_change_percentage_1h_in_currency:null,price_change_percentage_7d_in_currency:null,price_change_percentage_30d_in_currency:null,
      sector:String(d.sector||''),exchange:'US',
      tv_symbol:(d.symbol||'').toUpperCase()
    });
    seen.add(symbol);
  });
  return out.slice(0,TOTAL_STOCKS);
}

async function loadApiStocks(){
  const pages=await Promise.all([fetchStockApiPage(0),fetchStockApiPage(500)]);
  const stocks=buildApiStocks(pages);
  if(stocks.length<Math.min(TOTAL_STOCKS,1000)) throw new Error('US Stock API hanya mengembalikan '+stocks.length+' saham.');
  return stocks;
}

      setLiveStatus('error','PRICE UPDATE: RETRYING');
    }
  }finally{tvRefreshBusy=false;}
}
function connectStockData(){clearInterval(window.__tvRefreshTimer);window.__tvRefreshTimer=setInterval(refreshTradingViewPrices,60000);}

function updateStock(stock){

  const node=
    nodes.get(
      stock.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=
    Number(
      stock.price_change_percentage_24h
    )||0;

  node.gainEl.textContent=
    percent(gain);

  node.gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  const p=
    positions.get(
      stock.id
    );

  if(!p)
    return;

  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );

  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;

    p.size=
      newSize;

    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;

    p.homeX=
      p.x;

    p.homeY=
      p.y;

    clampPosition(p);

    applyPosition(
      stock.id
    );

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  const now=
    performance.now();

  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=p.vx;
        p.y+=p.vy;

        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.2;

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;

        const overlap=
          minimum-
          distance;

        const push=
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce=
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}

function openTradingView(){
  if(!selectedStock)return;
  const symbol=selectedStock.symbol.toUpperCase();
  const tvSymbol=selectedStock.tv_symbol||('NASDAQ:'+symbol);
  const parts=tvSymbol.split(':');
  const exchange=parts.length>1?parts[0]:'NASDAQ';
  const ticker=parts.length>1?parts.slice(1).join(':'):parts[0];
  const url='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(exchange+':'+ticker);
  window.open(url,'_blank');
}

function openStockLink(type){
  if(!selectedStock)return;
  const symbol=selectedStock.symbol.toUpperCase();
  const name=encodeURIComponent(selectedStock.name||symbol);
  let url='';
  if(type==='explorer'){
    url='https://www.nasdaq.com/market-activity/stocks/'+encodeURIComponent(symbol.toLowerCase());
  }else if(type==='website'){
    url='https://www.google.com/search?q='+encodeURIComponent(symbol+' '+(selectedStock.name||'')+' official company website');
  }
  if(url)window.open(url,'_blank');
}
