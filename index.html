<link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<link id="appleIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<script>
/* PWA single-file: logo (cincin putih di latar hitam) + manifest dibuat otomatis, bisa "Install app / Add to Home screen" */
(function(){
  function makeIcon(size){
    var c=document.createElement('canvas'); c.width=c.height=size; var x=c.getContext('2d');
    x.fillStyle='#000'; x.fillRect(0,0,size,size);
    x.strokeStyle='#fff'; x.lineWidth=size*32/512; x.beginPath(); x.arc(size/2,size/2,size*134/512,0,Math.PI*2); x.stroke();
    return c.toDataURL('image/png');
  }
  try{
    var i192=makeIcon(192), i512=makeIcon(512);
    document.getElementById('appleIcon').href=makeIcon(180);
    document.getElementById('appIcon').href=i192; document.getElementById('appIcon').type='image/png';
    var base=location.href.split('#')[0].split('?')[0];
    var manifest={name:'US Stock Cloud',short_name:'US Stock',description:'US Stock Cloud — pencarian & harga saham NASDAQ/NYSE',
      start_url:base,scope:base.replace(/[^\/]*$/,''),id:base,display:'standalone',orientation:'portrait',background_color:'#000000',theme_color:'#000000',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    var l=document.createElement('link'); l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){console.warn('PWA setup failed',e);}
})();
</script>

/* =====================================================
   GRID BUTTON + US STOCKS BRAND
===================================================== */

.stockBrand{
  position:absolute;
  top:10px;
  left:16px;
  z-index:50001;
  color:#fff;
  font-size:18px;

  letter-spacing:.4px;

  text-shadow:0 2px 10px rgba(255,255,255,.16);
}

.pageButton{
  position:absolute;
  top:9px;
  left:9px;
  width:30px;
  height:30px;
  z-index:50000;
  border-radius:50%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;

.pageButton:hover{

}

.pageButton:active{
  transform:translateY(0) scale(.88);
}

.gridIcon{
  width:14px;
  height:14px;

}

.pageButton:hover .gridIcon{

  filter:drop-shadow(0 5px 9px rgba(255,255,255,.30));
}

.gridIcon span{
  display:block;
  width:100%;
  height:100%;
  border:1.2px solid #fff;
  background:#fff;
  border-radius:2px;
  box-shadow:0 1px 4px rgba(255,255,255,.10);
}

/* =====================================================
   PAGE MENU
===================================================== */

.pageMenu{

  top:auto;
  left:auto;
  right:10px;

.pageItem.active{

/* =====================================================
   stock CLOUD
===================================================== */

.cloud{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

/* =====================================================
   stock
===================================================== */

.stockCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

  z-index:10;
}

.stockCard.dragging{
  z-index:60000;
  cursor:grabbing;
}

.stockBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:calc(var(--size) * .012);

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%
    );

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.stockBody::after{
  content:"";

  position:absolute;
  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.stockLogo{
  width:44%;
  height:44%;

  min-width:0;
  min-height:0;

  max-width:none;
  max-height:none;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:
    1px solid #72797f;

  padding:1px;
}

.stockSymbol{
  width:96%;
  margin-top:2px;

  text-align:center;

  color:#eee;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.105),
      20px
    );

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockPrice{
  width:96%;
  text-align:center;
  margin-top:1px;

  color:#c5cacf;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.070),
      16px
    );

  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockGain{
  margin-top:1px;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.068),
      16px
    );

  font-weight:900;
}

.up{
  color:#55dc91;
}

/* Gain di bubble: plus hijau muda, minus orange muda */
.stockGain.up{
  color:#9dffc0 !important;
}
.stockGain.down{
  color:#ffb877 !important;
}

.down{
  color:#ff5965;
}

/* =====================================================
   POPUP
===================================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:100000;

  display:none;

  align-items:center;
  justify-content:center;

<script>

/* =====================================================
   CONFIG
===================================================== */

const TOTAL_STOCKS = 1000;

const STOCKS_PER_PAGE = 100;

const TOTAL_PAGES =
  Math.ceil(
    TOTAL_STOCKS /
    STOCKS_PER_PAGE
  );

const MIN_SIZE = 52;

const MAX_SIZE = 118;

const SAFE_TOP = 55;


/* =====================================================
   STATE
===================================================== */

let allStocks = [];

let visibleStocks = [];

let currentPage = 0;

let selectedStock = null;

let drag = null;

let socket = null;
let reconnectTimer = null;
let liveReconnectAttempt = 0;
const LIVE_REFRESH_MS = 15000;

/* CACHE: simpan semua saham di localStorage, request API maksimal tiap 10 menit */
const CACHE_KEY='us_stock_cache_v1';
const CACHE_MS=10*60*1000;
let lastAttemptTs=0;
function readStockCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY); if(!raw)return null;
    const c=JSON.parse(raw);
    if(c&&Array.isArray(c.stocks)&&c.stocks.length&&Number.isFinite(c.ts))return c;
  }catch(e){}
  return null;
}
function writeStockCache(){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),stocks:allStocks}));}catch(e){}
}
function indexStocks(){
  stockMap.clear(); stockBySymbol.clear();
  allStocks.forEach((stock,index)=>{stock.market_cap_rank=index+1;stockMap.set(stock.id,stock);stockBySymbol.set(stock.symbol.toUpperCase(),stock);});
}

let positions = new Map();

let nodes = new Map();

let stockMap = new Map();
let stockBySymbol = new Map();


/* =====================================================
   DOM
===================================================== */

const cloud =
  document.getElementById(
    'cloud'
  );

const pageButton =
  document.getElementById(
    'pageButton'
  );

const pageMenu =
  document.getElementById(
    'pageMenu'
  );


/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:4
        }
      );

  return '$'+
    v.toLocaleString(
      'en-US',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return '$'+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return '$'+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return '$'+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return '$'+
      (v/1e3).toFixed(2)+
      'K';

  return '$'+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   stock SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.pow(
      g/100,
      .48
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}

function getListStocks(){
  if(listSource==='menu')return visibleStocks;
  const base=allStocks.slice(listRankStart-1,listRankStart+99);
  const g=c=>Number(c.price_change_percentage_24h)||0;
  if(listSort==='gainer')base.sort((a,b)=>g(b)-g(a));
  else if(listSort==='loser')base.sort((a,b)=>g(a)-g(b));
  else if(listSort==='trending')base.sort((a,b)=>(Number(b.total_volume)||0)-(Number(a.total_volume)||0));
  else base.sort((a,b)=>(Number(b.market_cap)||0)-(Number(a.market_cap)||0));
  return base;
}

function applyMarketFilter(name){listSource='menu';let base=[...allStocks]; if(name==='Gainer')base.sort((a,b)=>(b.price_change_percentage_24h||0)-(a.price_change_percentage_24h||0)); if(name==='Looser')base.sort((a,b)=>(a.price_change_percentage_24h||0)-(b.price_change_percentage_24h||0)); if(name==='Favorite')base=base.filter(c=>localStorage.getItem('fav_'+c.id)==='1'); visibleStocks=base.slice(0,STOCKS_PER_PAGE); cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)))}
let activeTimeFrame='1D';
function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  // US Stock Data does not provide 4H/1Y in the markets endpoint used here.
  // Use the current 24H value as the live fallback until a historical source is available.
  return Number(c.price_change_percentage_24h)||0;
}
function applyTimeFilter(name){
  if(!allStocks.length)return;
  listSource='menu';
  if(name.startsWith('Rank')){
    activeTimeFrame='RANK';
    const m=name.match(/(\d+)–(\d+)/);
    const base=allStocks.slice(Number(m[1])-1,Number(m[2]));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }else{
    activeTimeFrame=name;
    const base=[...allStocks];
    base.sort((a,b)=>getLiveTimeframeGain(b,name)-getLiveTimeframeGain(a,name));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }
  cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));
}

function refreshActiveTimeframe(){
  if(!allStocks.length)return;
  if(activeTimeFrame==='RANK')return;
  const base=[...allStocks].sort((a,b)=>getLiveTimeframeGain(b,activeTimeFrame)-getLiveTimeframeGain(a,activeTimeFrame));
  visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  visibleStocks.forEach(c=>updateStock(c));
  // Rebuild only when the ordering changes so the live cloud follows the selected timeframe.
  const ids=visibleStocks.map(c=>c.id).join('|');
  const currentIds=[...nodes.keys()].join('|');
  if(ids!==currentIds){
    cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));
  }
}

/* ---------- helper fetch dengan timeout ---------- */
function fetchJSON(url,opts,ms){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),ms||8000);
  return fetch(url,Object.assign({signal:ac.signal},opts||{})).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).finally(()=>clearTimeout(t));
}
function tvPost(filter,tickers){
  const body={options:{lang:'en'},markets:['america'],symbols:{query:{types:[]},tickers:tickers||[]},columns:TV_COLUMNS,sort:{sortBy:'market_cap_basic',sortOrder:'desc'},range:[0,60]};
  if(filter)body.filter=filter;
  return fetchJSON(TV_SCANNER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}
function skeletonStock(c){
  const s=String(c.symbol).toUpperCase();
  return {id:'us-'+s.replace(/[^A-Z0-9]/g,'-'),symbol:s,name:String(c.name||s),image:stockLogo(s),current_price:null,price_change_percentage_24h:null,market_cap:0,total_volume:0,high_24h:null,low_24h:null,market_cap_rank:null,circulating_supply:null,total_supply:null,max_supply:null,ath:null,atl:null,price_change_percentage_1h_in_currency:null,price_change_percentage_7d_in_currency:null,price_change_percentage_30d_in_currency:null,sector:'',exchange:c.exchange||'',tv_symbol:(c.exchange||'NASDAQ')+':'+s.replace(/-/g,'.')};
}

/* ---------- sumber pencarian (semua saham NASDAQ & NYSE, bukan hanya di webapp) ---------- */
// 1) TradingView scanner: cari berdasarkan ticker & nama perusahaan
function srcTradingView(q){
  const base=[{left:'type',operation:'equal',right:'stock'},{left:'exchange',operation:'in_range',right:SEARCH_EXCHANGES}];
  const jobs=[tvPost(base.concat([{left:'name',operation:'match',right:q}]))];
  if(q.length>=2)jobs.push(tvPost(base.concat([{left:'description',operation:'match',right:q}])));
  return Promise.allSettled(jobs).then(rs=>{
    const ok=rs.filter(r=>r.status==='fulfilled');
    if(!ok.length)throw new Error('TradingView gagal');
    const rows=ok.flatMap(r=>(r.value&&r.value.data)||[]);
    return buildTradingViewStocks({data:rows}).map(c=>{c.market_cap_rank=null;return c;});
  });
}
// 2) Yahoo Finance search: daftar lengkap saham, difilter ke NASDAQ/NYSE
function srcYahoo(q){
  return fetchJSON('https://query2.finance.yahoo.com/v1/finance/search?quotesCount=25&newsCount=0&listsCount=0&q='+encodeURIComponent(q)).then(j=>
    (j.quotes||[]).filter(x=>x.quoteType==='EQUITY'&&YAHOO_EXCH[x.exchange]&&x.symbol).map(x=>skeletonStock({symbol:x.symbol,name:x.longname||x.shortname,exchange:YAHOO_EXCH[x.exchange]})));
}
// 3) Nasdaq.com autocomplete resmi
function srcNasdaq(q){
  return fetchJSON('https://api.nasdaq.com/api/autocomplete/slookup/20?search='+encodeURIComponent(q),{headers:{'Accept':'application/json'}}).then(j=>
    ((j&&j.data)||[]).filter(x=>x.symbol&&/STOCK/i.test(String(x.asset||'STOCKS'))).map(x=>{
      const ex=String(x.exchange||'').toUpperCase();
      const exch=ex.includes('NYSE')?(ex.includes('AMERICAN')||ex.includes('MKT')?'AMEX':ex.includes('ARCA')?'ARCA':'NYSE'):ex.includes('NASDAQ')?'NASDAQ':ex.includes('AMEX')?'AMEX':'';
      return exch?skeletonStock({symbol:x.symbol,name:x.name,exchange:exch}):null;
    }).filter(Boolean));
}
// Lengkapi harga untuk hasil yang belum punya harga
async function enrichPrices(list){
  const need=list.filter(c=>c.current_price==null); if(!need.length)return list;
  try{
    const j=await tvPost(null,need.map(c=>c.tv_symbol));
    buildTradingViewStocks(j).forEach(f=>{const c=need.find(x=>symKey(x.symbol)===symKey(f.symbol));if(c){c.current_price=f.current_price;c.price_change_percentage_24h=f.price_change_percentage_24h;c.market_cap=f.market_cap;c.total_volume=f.total_volume;if(f.sector)c.sector=f.sector;}});
  }catch(e){}
  await Promise.allSettled(need.filter(c=>c.current_price==null).slice(0,12).map(c=>
    fetchJSON('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(c.symbol)+'?range=1d&interval=1d',null,6000).then(j=>{
      const m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta; if(!m)return;
      const p=Number(m.regularMarketPrice), prev=Number(m.chartPreviousClose);
      if(Number.isFinite(p)&&p>0){c.current_price=p;if(Number.isFinite(prev)&&prev>0)c.price_change_percentage_24h=(p-prev)/prev*100;}
    })));
  return list;
}

searchInput.addEventListener('input',()=>{
  const raw=searchInput.value.trim(), q=raw.toLowerCase(), seq=++searchSeq;
  clearTimeout(searchTimer); searchResults.innerHTML='';
  if(!q){searchResults.classList.remove('show');return}
  const seen=new Set(), box=document.createElement('div'), note=document.createElement('div');
  note.className='searchNote'; note.textContent='Mencari semua saham…';
  searchResults.append(box,note); searchResults.classList.add('show');
  // hasil lokal instan (urut: ticker persis > diawali > mengandung)
  const score=c=>{const s=c.symbol.toLowerCase();return s===q?0:s.startsWith(q)?1:c.name.toLowerCase().startsWith(q)?2:3};
  allStocks.filter(c=>(c.name+' '+c.symbol+' '+c.id).toLowerCase().includes(q)).sort((a,b)=>score(a)-score(b)).slice(0,30).forEach(c=>{seen.add(symKey(c.symbol));addSearchRow(c,box)});
  searchTimer=setTimeout(async()=>{
    const cached=remoteSearchCache.get(q);
    let pending=0, failed=0, okCount=0;
    const finish=()=>{
      if(seq!==searchSeq||pending>0)return;
      if(seen.size){note.remove();}
      else note.textContent=okCount?'Saham tidak ditemukan':'Pencarian gagal, periksa koneksi lalu coba lagi';
    };
    const addList=list=>{
      list.forEach(c=>{const k=symKey(c.symbol);if(seen.has(k))return;seen.add(k);addSearchRow(c,box);});
    };
    if(cached&&Date.now()-cached.ts<CACHE_MS){addList(cached.list);note.remove();return;}
    const collected=[];
    [srcTradingView,srcYahoo,srcNasdaq].forEach(src=>{
      pending++;
      src(raw).then(async list=>{
        okCount++;
        const fresh=list.filter(c=>!seen.has(symKey(c.symbol))&&!collected.some(x=>symKey(x.symbol)===symKey(c.symbol))).slice(0,25);
        if(seq!==searchSeq)return;
        await enrichPrices(fresh);
        if(seq!==searchSeq)return;
        collected.push(...fresh); addList(fresh);
        remoteSearchCache.set(q,{ts:Date.now(),list:collected.slice()});
      }).catch(()=>{failed++;}).finally(()=>{pending--;finish();});
    });
  },300);
});


/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  renderStockList();

  positions.clear();

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  visibleStocks.forEach(
    stock=>{

      const size=
        sizeFromGain(
          stock.price_change_percentage_24h
        );

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum=
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        stock.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}


/* =====================================================
   APPLY
===================================================== */

function applyPosition(id){

  const p=
    positions.get(id);

  const node=
    nodes.get(id);

  if(
    !p ||
    !node
  )
    return;

  node.card.style.setProperty(
    '--x',
    p.x+'px'
  );

  node.card.style.setProperty(
    '--y',
    p.y+'px'
  );

  node.card.style.setProperty(
    '--size',
    p.size+'px'
  );

  node.card.style.setProperty(
    '--rot',
    p.rotation+'deg'
  );

  const pulse=
    1+
    Math.sin(
      performance.now()*
      p.pulseSpeed+
      p.pulsePhase
    )*.035;

  node.card.style.setProperty(
    '--pulse',
    pulse.toFixed(4)
  );

}

function buildApiStocks(pages){
  const out=[],seen=new Set();
  pages.flatMap(x=>x.items||[]).forEach((d)=>{

    if(!symbol||seen.has(symbol)) return;

      id:'us-'+symbol.replace(/[^A-Z0-9]/g,'-'),symbol,

      current_price:Number.isFinite(price)&&price>0?price:null,
      price_change_percentage_24h:Number.isFinite(pct)?pct:null,
      market_cap:Number.isFinite(cap)?cap:0,total_volume:Number.isFinite(vol)?vol:0,
      high_24h:null,low_24h:null,market_cap_rank:out.length+1,

      sector:String(d.sector||''),exchange:'US',

    });

  return out.slice(0,TOTAL_STOCKS);

function updateStock(stock){

  const node=
    nodes.get(
      stock.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      stock.current_price

    )||0;

    (
      gain>=0

    Math.abs(
      oldSize-newSize
    )>=1
  ){

      p.x+
      oldSize/2;

      newSize;

      cx-

    p.y=
      cy-
      newSize/2;

      p.x;

    p.homeY=
      p.y;

    clampPosition(p);

    applyPosition(
      stock.id
    );

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

function animate(){

  const now=
    performance.now();

  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=p.vx;
        p.y+=p.vy;

        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.2;

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;

        const overlap=
          minimum-
          distance;

        const push=
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce=
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}

===================================================== */

function openTradingView(){
  if(!selectedStock)return;
  const symbol=selectedStock.symbol.toUpperCase();
  const tvSymbol=selectedStock.tv_symbol||('NASDAQ:'+symbol);
  const parts=tvSymbol.split(':');
  const exchange=parts.length>1?parts[0]:'NASDAQ';
  const ticker=parts.length>1?parts.slice(1).join(':'):parts[0];
  const url='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(exchange+':'+ticker);
  window.open(url,'_blank');
}

function openStockLink(type){
  if(!selectedStock)return;
  const symbol=selectedStock.symbol.toUpperCase();
  const name=encodeURIComponent(selectedStock.name||symbol);
  let url='';
  if(type==='explorer'){
    url='https://www.nasdaq.com/market-activity/stocks/'+encodeURIComponent(symbol.toLowerCase());
  }else if(type==='website'){
    url='https://www.google.com/search?q='+encodeURIComponent(symbol+' '+(selectedStock.name||'')+' official company website');
  }
  if(url)window.open(url,'_blank');
}

document.getElementById('tradingViewIcon').addEventListener('click',openTradingView);
document.getElementById('blockExplorer').addEventListener('click',()=>openStockLink('explorer'));
document.getElementById('coinWebsite').addEventListener('click',()=>openStockLink('website'));
