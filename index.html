<link id="appIcon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<link id="appleIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000'/%3E%3Ccircle cx='256' cy='256' r='134' fill='none' stroke='%23fff' stroke-width='32'/%3E%3C/svg%3E">
<script>
/* PWA single-file: logo (cincin putih di latar hitam) + manifest dibuat otomatis, bisa "Install app / Add to Home screen" */
(function(){
  function makeIcon(size){
    var c=document.createElement('canvas'); c.width=c.height=size; var x=c.getContext('2d');
    x.fillStyle='#000'; x.fillRect(0,0,size,size);
    x.strokeStyle='#fff'; x.lineWidth=size*32/512; x.beginPath(); x.arc(size/2,size/2,size*134/512,0,Math.PI*2); x.stroke();
    return c.toDataURL('image/png');
  }
  try{
    var i192=makeIcon(192), i512=makeIcon(512);
    document.getElementById('appleIcon').href=makeIcon(180);
    document.getElementById('appIcon').href=i192; document.getElementById('appIcon').type='image/png';
    var base=location.href.split('#')[0].split('?')[0];
    var manifest={name:'US Stock Cloud',short_name:'US Stock',description:'US Stock Cloud — search & prices for NASDAQ/NYSE stocks',
      start_url:base,scope:base.replace(/[^\/]*$/,''),id:base,display:'standalone',orientation:'portrait',background_color:'#000000',theme_color:'#000000',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    var l=document.createElement('link'); l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){console.warn('PWA setup failed',e);}
})();
</script>

/* =====================================================
   GRID BUTTON + US STOCKS BRAND
===================================================== */

.stockBrand{
  position:absolute;
  top:10px;
  left:16px;
  z-index:50001;
  color:#fff;
  font-size:18px;
  line-height:30px;
  font-weight:900;
  letter-spacing:.4px;
  white-space:nowrap;
  pointer-events:none;
  text-shadow:0 2px 10px rgba(255,255,255,.16);
}

.pageButton{
  position:absolute;
  top:9px;
  left:9px;
  width:30px;
  height:30px;
  z-index:50000;
  border-radius:50%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:
    transform .22s ease,
    filter .22s ease,
    opacity .22s ease;
}

.pageButton:hover{
  transform:translateY(-2px) scale(1.08);
  filter:drop-shadow(0 5px 10px rgba(255,255,255,.22));
}

.pageButton:active{
  transform:translateY(0) scale(.88);
}

.gridIcon{
  width:14px;
  height:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2px;
  filter:drop-shadow(0 3px 6px rgba(255,255,255,.18));
  transition:
    transform .22s ease,
    filter .22s ease;
}

.pageButton{touch-action:none !important;-webkit-user-select:none;user-select:none}
.pageButton.dragging .ghostIcon{animation:none;transform:scale(1.12)}
@keyframes ghostFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ghostIcon{animation:ghostFloat 2.6s ease-in-out infinite;width:38px;height:38px;filter:drop-shadow(0 0 6px rgba(125,250,0,.55))}
.pageButton:hover .gridIcon{
  transform:translateY(-1px);
  filter:drop-shadow(0 5px 9px rgba(255,255,255,.30));
}

.gridIcon span{
  display:block;
  width:100%;
  height:100%;
  border:1.2px solid #fff;
  background:#fff;
  border-radius:2px;
  box-shadow:0 1px 4px rgba(255,255,255,.10);
}

/* =====================================================
   PAGE MENU
===================================================== */

.pageMenu{
  position:absolute;
  top:auto;
  left:auto;
  right:10px;
  bottom:10px;
  height:40px;
  z-index:49000;

  display:flex;
  align-items:center;
  gap:6px;

  overflow-x:auto;
  overflow-y:hidden;

  opacity:0;
  pointer-events:none;

  justify-content:flex-end;

  transform:translateY(8px);

  transition:
    opacity .2s ease,
    transform .2s ease;

  scrollbar-width:none;
}

.pageMenu::-webkit-scrollbar{
  display:none;
}

.pageMenu.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

.pageItem{
  flex:0 0 auto;
  height:32px;
  padding:0 13px;
  border-radius:16px;
  border:1px solid #555b60;
  background:rgba(10,10,10,.9);
  color:#aeb4b9;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;

  display:flex;
  align-items:center;
  justify-content:center;
}

.pageItem.active{
  color:#fff;
  border-color:#999fa4;
  background:rgba(130,135,140,.17);
}

/* =====================================================
   stock CLOUD
===================================================== */

.cloud{
  position:absolute;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

/* =====================================================
   stock
===================================================== */

.stockCard{
  position:absolute;

  left:0;
  top:0;

  width:var(--size);
  height:var(--size);

  border-radius:50%;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;

  will-change:
    transform,
    width,
    height;

  cursor:grab;

  transform:
    translate3d(
      var(--x),
      var(--y),
      0
    )
    rotate(
      var(--rot)
    )
    scale(var(--pulse,1));

  z-index:10;
}

.stockCard.dragging{
  z-index:60000 !important;
  cursor:grabbing;
}

.stockBody{
  position:relative;

  width:100%;
  height:100%;

  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:calc(var(--size) * .012);

  overflow:hidden;

  border:
    1px solid
    rgba(120,126,132,.85);

  background:
    radial-gradient(
      circle at 35% 25%,
      rgba(180,185,190,.12),
      rgba(18,18,18,.91) 62%,
      #000 100%
    );

  box-shadow:
    inset 0 0 15px
    rgba(190,195,200,.055),

    0 0 13px
    rgba(180,185,190,.025);

  pointer-events:none;
}

.stockBody::after{
  content:"";

  position:absolute;
  inset:calc(var(--size) * .025);

  border-radius:50%;

  border:
    1px solid
    rgba(180,185,190,.08);
}

.stockLogo{
  width:44%;
  height:44%;

  min-width:0;
  min-height:0;

  max-width:none;
  max-height:none;

  border-radius:50%;

  object-fit:contain;

  background:#000;

  border:0;

  padding:1px;
}

.stockSymbol{
  width:96%;
  margin-top:2px;

  text-align:center;

  color:#eee;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.105),
      20px
    );

  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockPrice{
  width:96%;
  text-align:center;
  margin-top:1px;

  color:#c5cacf;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.070),
      16px
    );

  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockGain{
  margin-top:1px;

  font-size:
    clamp(
      7px,
      calc(var(--size)*.068),
      16px
    );

  font-weight:900;
}

.up{
  color:#7dfa00;
}

/* Gain di bubble: plus hijau muda, minus orange muda */
.stockGain.up{
  color:#7dfa00 !important;
}
.stockGain.down{
  color:#fb038d !important;
}

.down{
  color:#fb038d;
}

/* =====================================================
   POPUP
===================================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:100000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:10px;

  background:rgba(0,0,0,.20);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.overlay.show{
  display:flex;
}

.popup{
  position:relative;
  font-family:'Nunito','Varela Round',ui-rounded,'SF Pro Rounded','Quicksand','Segoe UI',system-ui,sans-serif;

  width:min(390px,95vw);

  max-height:
    calc(100dvh - 36px);

  overflow:auto;

  padding:12px 14px;

  border-radius:21px;

  border:
    1px solid
    rgba(135,142,149,.65);

  background:
    linear-gradient(
      145deg,
      rgba(31,33,35,.80),
      rgba(2,2,2,.64)

  box-shadow:
    0 20px 55px
    rgba(0,0,0,.78);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  animation:
    popupIn .2s ease-out;
}

.popup button,.popup .value,.popup .label{font-family:inherit}

@keyframes popupIn{
  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.close{

  top:7px;
  right:7px;

  width:30px;
  height:30px;

  border-radius:0;
  background:transparent;

  color:#ddd;

  font-size:22px;
  line-height:1;

.popupHead{

}

.popupLogo{

  height:45px;

  background:#000;

  border:
    1px solid #777e84;

  padding:3px;
}

.popupName{

  font-weight:900;
  color:#fff;
}

.popupSymbol{

}

.priceRow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

.favoriteStar.active{color:#7dfa00}.favoriteStar.active svg{fill:currentColor}
.popupActions{display:flex;align-items:center;gap:0;flex:0 0 auto;margin-top:-1px}

.popupAction svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.popupAction:hover{background:rgba(255,255,255,.07);color:#fff}
.popupPrice{
  font-size:31px;
  line-height:1.05;
  font-weight:900;

}

.popupGain{
  margin-top:3px;
  font-size:15px;
  font-weight:900;
}

.chart{
  width:100%;
  height:38px;

  margin-top:7px;

  border-radius:12px;

  border:
    1px solid
    rgba(135,142,149,.55);

  background:
    rgba(255,255,255,.035);

  color:#ddd;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:9px;

  font-weight:900;
}

.chart svg{
  width:20px;
  height:20px;
}

.infoGrid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;

  margin-top:7px;
}

.info{
  min-height:47px;

  padding:6px 8px;

  border-radius:11px;

  background:
    rgba(255,255,255,.028);

  border:0;
}

.info:last-child:nth-child(3n+2){

}

.label{
  margin-bottom:3px;

  color:#8f979d;

  font-size:10px;
  font-weight:800;

  text-transform:none;
  letter-spacing:.2px;
}

.value{
  color:#f0f1f2;

  font-size:13px;
  font-weight:900;

  word-break:break-word;
}

@media (max-width:520px){

  .popup{
    width:min(390px,92vw);

  .popupName{

  .popupSymbol{

  }

.slide{position:relative;z-index:2;width:min(86vw,340px);height:66px;margin:0 0 calc(34px + env(safe-area-inset-bottom,0px));border-radius:33px;background:rgba(8,12,6,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(125,250,0,.55);box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 0 26px rgba(125,250,0,.28),0 14px 40px rgba(0,0,0,.7);overflow:hidden;animation:slideGlow 2.4s ease-in-out infinite}
@keyframes slideGlow{0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 0 20px rgba(125,250,0,.20),0 14px 40px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 1px rgba(0,0,0,.6) inset,0 0 34px rgba(125,250,0,.42),0 14px 40px rgba(0,0,0,.7)}}
.slideFill{position:absolute;left:0;top:0;bottom:0;width:66px;border-radius:33px;background:linear-gradient(90deg,rgba(125,250,0,.10),rgba(125,250,0,.55));pointer-events:none}
.slideText{position:absolute;inset:0;padding-left:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Nunito','Varela Round',ui-rounded,system-ui,sans-serif;font-size:15px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}

.slide.snap .slideThumb,.slide.snap .slideFill,.slide.snap .slideText{transition:transform .28s cubic-bezier(.2,.9,.3,1),width .28s cubic-bezier(.2,.9,.3,1),opacity .28s ease}

/* ===== RANKING: grid teks outline (tanpa slider) ===== */
.rkGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rkOpt{height:38px;padding:0 4px;border:1.5px solid rgba(125,250,0,.55);border-radius:14px;background:transparent;color:#7dfa00;
  font:800 12px 'Nunito','Varela Round',ui-rounded,system-ui,sans-serif;white-space:nowrap;cursor:pointer;outline:0;opacity:.8;transition:none}
.rkOpt.active{background:rgba(125,250,0,.16);border-color:#7dfa00;opacity:1}
.rkOpt:active{transform:scale(.96)}
.rankMenu{width:min(300px,calc(100vw - 36px)) !important;max-height:50vh !important;overflow-y:auto !important;
  background:rgba(0,0,0,.62) !important;border:1px solid rgba(255,255,255,.14) !important;border-radius:18px !important;padding:12px !important}
.rkMenuBox{padding:2px 18px 8px !important}
.pageMenu .rkGrid{max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none}
.pageMenu .rkGrid::-webkit-scrollbar{display:none}

/* ===== RESPONSIF: feedback tap instan, transisi minimal ===== */
.pageMenu,.pageMenu.show{transition:opacity .08s linear !important}
.pageButton:active{transform:scale(.9)}
.tabItem:active,.viewBtn:active,.menuItem:active,.sortOpt:active,.rkOpt:active,.rankBtn:active,.funnelBtn:active,.searchButton:active,.popupAction:active,.favoriteStar:active{opacity:.55 !important}
button,.stockRow,.tabItem,.viewBtn,.rkOpt{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stockRow{content-visibility:auto;contain-intrinsic-size:auto 56px}
.stockList{contain:layout paint;transform:translateZ(0)}

/* ===== LIST: opsi rank & funnel dihapus (ikut popup menu), teks lebih besar ===== */
.listBar .rankWrap,.listBar #listSortBtn,.listBar #listSortMenu,.rankMenu{display:none !important}
.listBar{padding:62px 0 4px !important;border-bottom:0 !important;background:transparent !important}
.stockRow{padding:12px 18px;gap:14px}
.stockRow img{width:40px;height:40px}
.stockRow .rSym{font-size:16.5px}
.stockRow .rName{font-size:12.5px}
.stockRow .rPrice{font-size:15.5px}
.stockRow .rGain{font-size:14px}
/* ===== OUTLINE opsi ranking: abu-abu gelap ===== */
.rkOpt,.rkOpt.active{border-color:#3b3f44 !important}

/* ===== FIX: halaman hitam di bawah setelah kembali dari chart ===== */
html,body{position:fixed;inset:0;width:100%;height:100%}
.app{position:fixed !important;inset:0 !important;width:auto !important;height:auto !important}
</style>

<script>

/* =====================================================

const TOTAL_STOCKS = 10000; // batas maksimal; jumlah sebenarnya mengikuti sumber data

const STOCKS_PER_PAGE = 100;

const MIN_SIZE = 46;

let visibleStocks = [];

let drag = null;

/* CACHE: simpan semua saham di localStorage, request API maksimal tiap 10 menit */
const CACHE_KEY='us_stock_cache_v2';
const CACHE_MS=10*60*1000;
let lastAttemptTs=0;
// Cache semua data saham di IndexedDB (async, tanpa batas 5MB localStorage, tanpa JSON.parse berat).
const IDB_NAME='us_stock_db', IDB_STORE='kv';
let cacheTs=0, cacheWriteTimer=0;
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{r.result.createObjectStore(IDB_STORE);};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    q.onsuccess=()=>{res(q.result);db.close();};
    q.onerror=()=>{rej(q.error);db.close();};
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>{res();db.close();};
    tx.onerror=tx.onabort=()=>{rej(tx.error);db.close();};
  });
}
try{localStorage.removeItem('us_stock_cache_v1');localStorage.removeItem('us_stock_cache_v2');}catch(e){}
async function readStockCache(){
  try{
    const c=await idbGet(CACHE_KEY);
    if(c&&Array.isArray(c.stocks)&&c.stocks.length&&Number.isFinite(c.ts))return c;
  }catch(e){}
  return null;
}
// touch=true: data harga baru saja diperbarui (cap waktu cache ikut diperbarui)
function writeStockCache(touch){
  if(touch)cacheTs=Date.now();
  if(!cacheTs)cacheTs=Date.now();
  clearTimeout(cacheWriteTimer);
  cacheWriteTimer=setTimeout(()=>{
    idbSet(CACHE_KEY,{ts:cacheTs,stocks:allStocks}).catch(e=>console.warn('Cache write failed',e));
  },400);
}
function indexStocks(){
  stockMap.clear(); stockBySymbol.clear();
  allStocks.forEach((stock,index)=>{stock.market_cap_rank=index+1;stockMap.set(stock.id,stock);stockBySymbol.set(stock.symbol.toUpperCase(),stock);});
}

let positions = new Map();

let nodes = new Map();

let stockBySymbol = new Map();


/* =====================================================
   DOM

/* =====================================================
   FORMAT
===================================================== */

function price(v){

  if(v == null)
    return '—';

  v=Number(v);

  if(v>=1000)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:1
        }
      );

  if(v>=1)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:3
        }
      );

  if(v>=0.01)
    return '$'+
      v.toLocaleString(
        'en-US',
        {
          maximumFractionDigits:4
        }
      );

  return '$'+
    v.toLocaleString(
      'en-US',
      {
        maximumFractionDigits:8
      }
    );
}


function percent(v){

  if(v==null)
    return '—';

  v=Number(v);

  return (
    v>=0
      ?'+'
      :''
  )+
  v.toFixed(2)+
  '%';
}


function large(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return '$'+
      (v/1e12).toFixed(2)+
      'T';

  if(v>=1e9)
    return '$'+
      (v/1e9).toFixed(2)+
      'B';

  if(v>=1e6)
    return '$'+
      (v/1e6).toFixed(2)+
      'M';

  if(v>=1e3)
    return '$'+
      (v/1e3).toFixed(2)+
      'K';

  return '$'+
    v.toLocaleString();
}


function supply(v){

  if(v==null)
    return '—';

  v=Number(v);

  if(v>=1e12)
    return (v/1e12).toFixed(2)+'T';

  if(v>=1e9)
    return (v/1e9).toFixed(2)+'B';

  if(v>=1e6)
    return (v/1e6).toFixed(2)+'M';

  return v.toLocaleString(
    'en-US',
    {
      maximumFractionDigits:0
    }
  );
}


/* =====================================================
   stock SIZE BASED ON GAIN
===================================================== */

function sizeFromGain(gain){

  const g=
    Math.min(
      Math.abs(
        Number(gain)||0
      ),
      100
    );

  const n=
    Math.pow(
      g/100,
      .48
    );

  return Math.round(
    MIN_SIZE+
    (
      MAX_SIZE-
      MIN_SIZE
    )*n
  );
}


/* =====================================================
   RANDOM
===================================================== */

function random(min,max){

  return Math.random()*
    (max-min)+min;
}


/* =====================================================
   VIEW MODE: bubble / list (tetap di halaman utama)
===================================================== */
let viewMode='bubble';
const listRows=new Map();
function setViewMode(mode){
  viewMode=mode;
  document.querySelector('.app').classList.toggle('listMode',mode==='list');
  pageMenu.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='list'){renderStockList();const l=document.getElementById('stockList');if(l)l.scrollTop=0;}
}
let suppressRowUntil=0;
let listSource='own';            // 'own' = dropdown + funnel, 'menu' = filter dari menu
let listRankStart=1;             // 1,101,...,901
let listSort='marketcap';        // marketcap | trending | gainer | loser
const SORT_LABELS={trending:'Trending',gainer:'Gainer',loser:'Loser',marketcap:'Marketcap'};
function getListStocks(){
  if(listSource==='menu')return visibleStocks;
  const base=allStocks.slice(listRankStart-1,listRankStart+99);
  const g=c=>Number(c.price_change_percentage_24h)||0;
  if(listSort==='gainer')base.sort((a,b)=>g(b)-g(a));
  else if(listSort==='loser')base.sort((a,b)=>g(a)-g(b));
  else if(listSort==='trending')base.sort((a,b)=>(Number(b.total_volume)||0)-(Number(a.total_volume)||0));
  else base.sort((a,b)=>(Number(b.market_cap)||0)-(Number(a.market_cap)||0));
  return base;
}
function renderStockList(){
  const box=document.getElementById('listRows'), scroller=document.getElementById('stockList'); if(!box)return;
  const keep=scroller?scroller.scrollTop:0;
  listRows.clear(); box.innerHTML='';
  const frag=document.createDocumentFragment();
  getListStocks().forEach(stock=>{
    const row=document.createElement('div'); row.className='stockRow';
    const img=document.createElement('img'); img.alt=''; img.loading='lazy'; setReliableLogo(img,stock.symbol);
    const info=document.createElement('div'); info.className='rInfo';
    const sym=document.createElement('div'); sym.className='rSym'; sym.textContent=stock.symbol.toUpperCase();
    const nm=document.createElement('div'); nm.className='rName'; nm.textContent=stock.name;
    info.appendChild(sym); info.appendChild(nm);
    const right=document.createElement('div'); right.className='rRight';
    const pr=document.createElement('div'); pr.className='rPrice';
    const gn=document.createElement('div'); gn.className='rGain';
    right.appendChild(pr); right.appendChild(gn);
    row.appendChild(img); row.appendChild(info); row.appendChild(right);
    row.onclick=()=>{if(Date.now()<suppressRowUntil)return;openPopup(stock.id);};
    listRows.set(stock.id,{pr,gn});
    fillListRow(stock,pr,gn);
    frag.appendChild(row);
  });
  box.appendChild(frag);
  if(scroller)scroller.scrollTop=keep;
}
function initListBar(){
  const btn=document.getElementById('listSortBtn'),
        menu=document.getElementById('listSortMenu'), label=document.getElementById('listSortLabel'),
        rBtn=document.getElementById('listRankBtn'), rMenu=document.getElementById('listRankMenu'), rLabel=document.getElementById('listRankLabel');
  const closeRank=()=>{rMenu.classList.remove('show');rBtn.classList.remove('open');};
  const rkText=i=>(i*100+1)+'–'+Math.min(i*100+100,allStocks.length||1e9);
  const rkBuild=()=>{
    const n=Math.max(1,Math.ceil(allStocks.length/100)||10);
    const cur=listSource==='own'?Math.floor((listRankStart-1)/100):-1;
    rMenu.innerHTML='<div class="rkGrid"></div>';
    const g=rMenu.firstChild;
    for(let i=0;i<n;i++){
      const o=document.createElement('button');o.type='button';
      o.className='rkOpt'+(i===cur?' active':'');o.textContent=rkText(i);
      o.onclick=e=>{e.stopPropagation();suppressRowUntil=Date.now()+600;listSource='own';listRankStart=i*100+1;rLabel.textContent=rkText(i);closeRank();g.querySelectorAll('.rkOpt').forEach(x=>x.classList.remove('active'));o.classList.add('active');afterPaint(()=>{paint();renderStockList();document.getElementById('stockList').scrollTop=0;});};
      g.appendChild(o);
    }
  };
  rMenu.addEventListener('click',e=>e.stopPropagation());
  rkBuild(); (window.__rkBuilds=window.__rkBuilds||[]).push(rkBuild);
  rBtn.onclick=(e)=>{e.stopPropagation();menu.classList.remove('show');btn.classList.remove('open');const o=rMenu.classList.toggle('show');rBtn.classList.toggle('open',o);if(o)rkBuild();};
  const paint=()=>{
    label.textContent=SORT_LABELS[listSort];
    menu.querySelectorAll('.sortOpt').forEach(b=>b.classList.toggle('active',listSource==='own'&&b.dataset.k===listSort));
  };
  Object.keys(SORT_LABELS).forEach(k=>{
    const b=document.createElement('button'); b.className='sortOpt'; b.dataset.k=k; b.textContent=SORT_LABELS[k];
    b.onclick=()=>{suppressRowUntil=Date.now()+600;listSource='own';listSort=k;closeRank();menu.classList.remove('show');btn.classList.remove('open');label.textContent=SORT_LABELS[k];afterPaint(()=>{paint();renderStockList();document.getElementById('stockList').scrollTop=0;});};
    menu.appendChild(b);
  });
  btn.onclick=(e)=>{e.stopPropagation();closeRank();const o=menu.classList.toggle('show');btn.classList.toggle('open',o);};
  document.addEventListener('click',()=>{closeRank();menu.classList.remove('show');btn.classList.remove('open');});
  let swallowUntil=0;
  const inPopup=t=>rMenu.contains(t)||rBtn.contains(t)||menu.contains(t)||btn.contains(t);
  const outsideClose=e=>{
    if(inPopup(e.target))return;
    if(!rMenu.classList.contains('show')&&!menu.classList.contains('show'))return;
    closeRank();menu.classList.remove('show');btn.classList.remove('open');
    suppressRowUntil=Date.now()+500;swallowUntil=Date.now()+500;
  };
  document.addEventListener('pointerdown',outsideClose,true);
  document.addEventListener('touchstart',outsideClose,{capture:true,passive:true});
  document.addEventListener('click',e=>{
    if(Date.now()>=swallowUntil)return;
    const t=e.target;
    if(inPopup(t)||(t.closest&&t.closest('#pageButton')))return;
    e.stopPropagation();e.preventDefault();
  },true);
  paint();
}
initListBar();

function getLiveTimeframeGain(c,name){
  if(name==='1H')return Number(c.price_change_percentage_1h_in_currency)||0;
  if(name==='1D')return Number(c.price_change_percentage_24h)||0;
  if(name==='1W')return Number(c.price_change_percentage_7d_in_currency)||0;
  if(name==='1M')return Number(c.price_change_percentage_30d_in_currency)||0;
  // US Stock Data does not provide 4H/1Y in the markets endpoint used here.
  // Use the current 24H value as the live fallback until a historical source is available.

function applyTimeFilter(name){

    const base=allStocks.slice(Number(m[1])-1,Number(m[2]));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }else{
    activeTimeFrame=name;
    const base=[...allStocks];
    base.sort((a,b)=>getLiveTimeframeGain(b,name)-getLiveTimeframeGain(a,name));
    visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  }

}

function refreshActiveTimeframe(){
  if(!allStocks.length)return;
  if(activeTimeFrame==='RANK')return;
  const base=[...allStocks].sort((a,b)=>getLiveTimeframeGain(b,activeTimeFrame)-getLiveTimeframeGain(a,activeTimeFrame));
  visibleStocks=base.slice(0,STOCKS_PER_PAGE);
  visibleStocks.forEach(c=>updateStock(c));

  const ids=visibleStocks.map(c=>c.id).join('|');
  const currentIds=[...nodes.keys()].join('|');
  if(ids!==currentIds){

// 1) TradingView scanner: cari berdasarkan ticker & nama perusahaan
function srcTradingView(q){
  const base=[{left:'type',operation:'equal',right:'stock'},{left:'exchange',operation:'in_range',right:SEARCH_EXCHANGES}];
  const jobs=[tvPost(base.concat([{left:'name',operation:'match',right:q}]))];
  if(q.length>=2)jobs.push(tvPost(base.concat([{left:'description',operation:'match',right:q}])));
  return Promise.allSettled(jobs).then(rs=>{
    const ok=rs.filter(r=>r.status==='fulfilled');
    if(!ok.length)throw new Error('TradingView failed');
    const rows=ok.flatMap(r=>(r.value&&r.value.data)||[]);
    return buildTradingViewStocks({data:rows}).map(c=>{c.market_cap_rank=null;return c;});
  });
}

// Lengkapi harga untuk hasil yang belum punya harga
async function enrichPrices(list){
  const need=list.filter(c=>c.current_price==null); if(!need.length)return list;
  try{
    const j=await tvPost(null,need.map(c=>c.tv_symbol));
    buildTradingViewStocks(j).forEach(f=>{const c=need.find(x=>symKey(x.symbol)===symKey(f.symbol));if(c){c.current_price=f.current_price;c.price_change_percentage_24h=f.price_change_percentage_24h;c.market_cap=f.market_cap;c.total_volume=f.total_volume;if(f.sector)c.sector=f.sector;}});
  }catch(e){}
  await Promise.allSettled(need.filter(c=>c.current_price==null).slice(0,12).map(c=>
    fetchJSON('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(c.symbol)+'?range=1d&interval=1d',null,6000).then(j=>{
      const m=j&&j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta; if(!m)return;
      const p=Number(m.regularMarketPrice), prev=Number(m.chartPreviousClose);
      if(Number.isFinite(p)&&p>0){c.current_price=p;if(Number.isFinite(prev)&&prev>0)c.price_change_percentage_24h=(p-prev)/prev*100;}
    })));
  return list;
}

/* =====================================================
   POSITIONS
===================================================== */

function createPositions(){

  renderStockList();

  positions.clear();

  const width=
    innerWidth;

  const height=
    innerHeight;

  const placed=[];

  visibleStocks.forEach(
    stock=>{

      const size=
        sizeFromGain(
          stock.price_change_percentage_24h
        );

      let x=0;
      let y=0;

      let found=false;

      for(
        let attempt=0;
        attempt<350;
        attempt++
      ){

        x=
          random(
            1,
            Math.max(
              2,
              width-size-1
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size-1
            )
          );

        let good=true;

        for(
          const p of placed
        ){

          const dx=
            (
              x+
              size/2
            )-
            (
              p.x+
              p.size/2
            );

          const dy=
            (
              y+
              size/2
            )-
            (
              p.y+
              p.size/2
            );

          const distance=
            Math.sqrt(
              dx*dx+
              dy*dy
            );

          const minimum=
            (
              size/2+
              p.size/2
            )*.78;

          if(
            distance<
            minimum
          ){

            good=false;

            break;

          }

        }

        if(good){

          found=true;

          break;

        }

      }

      if(!found){

        x=
          random(
            0,
            Math.max(
              1,
              width-size
            )
          );

        y=
          random(
            SAFE_TOP,
            Math.max(
              SAFE_TOP+1,
              height-size
            )
          );

      }

      const p={

        x:x,
        y:y,

        homeX:x,
        homeY:y,

        vx:0,
        vy:0,

        size:size,

        phaseX:
          Math.random()*
          Math.PI*2,

        phaseY:
          Math.random()*
          Math.PI*2,

        speedX:
          random(
            .00032,
            .00072
          ),

        speedY:
          random(
            .00028,
            .00068
          ),

        amplitudeX:
          random(2.0,5.0),

        amplitudeY:
          random(2.0,5.0),

        rotation:0,

        pulsePhase:
          Math.random()*
          Math.PI*2,

        pulseSpeed:
          random(
            .00065,
            .00125
          ),

        rotSpeed:
          random(
            .00012,
            .00032
          )

      };

      placed.push(p);

      positions.set(
        stock.id,
        p
      );

    }
  );

}


/* =====================================================
   CLAMP
===================================================== */

function clampPosition(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  p.x=
    Math.max(
      0,
      Math.min(
        maxX,
        p.x
      )
    );

  p.y=
    Math.max(
      SAFE_TOP,
      Math.min(
        maxY,
        p.y
      )
    );

}


function bounceFromEdges(p){

  const w=
    innerWidth;

  const h=
    innerHeight;

  const maxX=
    Math.max(
      0,
      w-p.size
    );

  const maxY=
    Math.max(
      SAFE_TOP,
      h-p.size
    );

  const bounce=.82;

  if(
    p.x<=0
  ){

    p.x=0;

    if(p.vx<0)
      p.vx=
        -p.vx*bounce;

  }else if(
    p.x>=maxX
  ){

    p.x=maxX;

    if(p.vx>0)
      p.vx=
        -p.vx*bounce;

  }

  if(
    p.y<=SAFE_TOP
  ){

    p.y=SAFE_TOP;

    if(p.vy<0)
      p.vy=
        -p.vy*bounce;

  }else if(
    p.y>=maxY
  ){

    p.y=maxY;

    if(p.vy>0)
      p.vy=
        -p.vy*bounce;

  }

}

  );

  node.card.style.setProperty(

  );

  const pulse=
    1+
    Math.sin(
      performance.now()*
      p.pulseSpeed+
      p.pulsePhase
    )*.035;

  node.card.style.setProperty(
    '--pulse',
    pulse.toFixed(4)
  );

}

function logoCandidates(symbol){

function buildTradingViewStocks(json){
  const rows=Array.isArray(json&&json.data)?json.data:[], out=[], seen=new Set();
  rows.forEach(row=>{

// Stable US stock universe/quote fallback. The public dataset explicitly supports
// browser CORS and returns up to 500 rows per request, so we load 2 pages = 1,000.
async function fetchStockApiPage(offset){
  const url='https://top-us-stock-tickers.zyhe.me/api/v2/tickers?collection=us&sort=market_cap&order=desc&limit=500&offset='+offset;
  const response=await fetch(url,{cache:'no-store',headers:{'Accept':'application/json'}});
  if(!response.ok) throw new Error('US Stock API HTTP '+response.status);
  const json=await response.json();
  if(!json||!Array.isArray(json.items)) throw new Error('US Stock API returned invalid data');
  return json;
}

function buildApiStocks(pages){
  const out=[],seen=new Set();
  pages.flatMap(x=>x.items||[]).forEach((d)=>{
    const symbol=String(d.symbol||'').trim().toUpperCase();
    if(!symbol||seen.has(symbol)) return;
    const price=Number(d.price), pct=Number(d.percent_change), cap=Number(d.market_cap), vol=Number(d.volume);
    out.push({
      id:'us-'+symbol.replace(/[^A-Z0-9]/g,'-'),symbol,
      name:String(d.name||symbol),image:stockLogo(symbol),
      current_price:Number.isFinite(price)&&price>0?price:null,
      price_change_percentage_24h:Number.isFinite(pct)?pct:null,
      market_cap:Number.isFinite(cap)?cap:0,total_volume:Number.isFinite(vol)?vol:0,
      high_24h:null,low_24h:null,market_cap_rank:out.length+1,
      circulating_supply:null,total_supply:null,max_supply:null,ath:null,atl:null,
      price_change_percentage_1h_in_currency:null,price_change_percentage_7d_in_currency:null,price_change_percentage_30d_in_currency:null,
      sector:String(d.sector||''),exchange:'US',
      tv_symbol:(d.symbol||'').toUpperCase()
    });
    seen.add(symbol);
  });
  return out.slice(0,TOTAL_STOCKS);
}

async function loadApiStocks(){
  const pages=await Promise.all([fetchStockApiPage(0),fetchStockApiPage(500)]);
  const stocks=buildApiStocks(pages);
  if(stocks.length<Math.min(TOTAL_STOCKS,1000)) throw new Error('US Stock API hanya mengembalikan '+stocks.length+' saham.');
  return stocks;
}

// Ambil halaman API mulai offset tertentu sampai data habis (500 per request).
async function fetchApiPagesFrom(startOffset,maxCount){
  const pages=[]; let offset=startOffset, limit=maxCount||TOTAL_STOCKS;
  while(offset<limit){
    let page; try{page=await fetchStockApiPage(offset);}catch(e){console.warn('Stock API page failed @'+offset,e);break;}
    if(!page.items||!page.items.length)break;
    pages.push(page); offset+=500;
    if(page.items.length<500)break;
  }
  return pages;
}
// Ambil semua halaman sampai jumlah n (paralel) untuk refresh harga.
function fetchApiPagesUpTo(n){
  return Promise.all(Array.from({length:Math.max(2,Math.ceil(n/500))},(_,i)=>fetchStockApiPage(i*500)));
}

    fresh.forEach(s=>{const stock=stockBySymbol.get(s.symbol);if(!stock)return;stock.current_price=s.current_price;stock.price_change_percentage_24h=s.price_change_percentage_24h;stock.total_volume=s.total_volume;stock.market_cap=s.market_cap;stock.image=stockLogo(stock.symbol);updateStock(stock);const node=nodes.get(stock.id);if(node&&node.logo)setReliableLogo(node.logo,stock.symbol);if(selectedStock&&selectedStock.id===stock.id)updatePopup(stock);});

    }catch(tailErr){console.warn('Tail refresh failed',tailErr);}}
    writeStockCache(true);
    setLiveStatus('live','LIVE PRICE: TRADINGVIEW '+new Date().toLocaleTimeString('en-US'));
  }catch(e){
    // Keep the 1,000-stock UI alive and refresh its snapshot data instead of blanking it.
    console.warn('TradingView refresh failed; using stock API snapshot',e);
    try{
      const pages=await fetchApiPagesUpTo(allStocks.length);
      const fresh=buildApiStocks(pages);
      fresh.forEach(s=>{const stock=stockBySymbol.get(s.symbol);if(!stock)return;if(Number.isFinite(s.current_price))stock.current_price=s.current_price;if(Number.isFinite(s.price_change_percentage_24h))stock.price_change_percentage_24h=s.price_change_percentage_24h;if(Number.isFinite(s.total_volume))stock.total_volume=s.total_volume;if(Number.isFinite(s.market_cap))stock.market_cap=s.market_cap;updateStock(stock);if(selectedStock&&selectedStock.id===stock.id)updatePopup(stock);});
      writeStockCache(true);
      setLiveStatus('live','PRICE SNAPSHOT: UPDATED '+new Date().toLocaleTimeString('en-US'));
    }catch(fallbackError){
      console.warn('Stock API refresh failed',fallbackError);
      setLiveStatus('error','PRICE UPDATE: RETRYING');
    }
  }finally{tvRefreshBusy=false;}
}

function updateStock(stock){

  updateListRow(stock);

  const node=
    nodes.get(
      stock.id
    );

  if(!node)
    return;

  node.priceEl.textContent=
    price(
      stock.current_price
    );

  const gain=
    Number(
      stock.price_change_percentage_24h
    )||0;

  node.gainEl.textContent=
    percent(gain);

  node.absGain=Math.abs(gain);
  scheduleBubbleLayers();

  node.gainEl.className=
    'stockGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  if(node.body){
    node.body.classList.toggle('gainUp',gain>=0);
    node.body.classList.toggle('gainDown',gain<0);
  }

  const p=
    positions.get(
      stock.id
    );

  if(!p)
    return;

  const oldSize=
    p.size;

  const newSize=
    sizeFromGain(
      gain
    );

  if(
    Math.abs(
      oldSize-newSize
    )>=1
  ){

    const cx=
      p.x+
      oldSize/2;

    const cy=
      p.y+
      oldSize/2;

    p.size=
      newSize;

    p.x=
      cx-
      newSize/2;

    p.y=
      cy-
      newSize/2;

    p.homeX=
      p.x;

    p.homeY=
      p.y;

    clampPosition(p);

    applyPosition(
      stock.id
    );

  }

}


/* =====================================================
   DRAG
===================================================== */

function enableDrag(
  card,
  id
){

  let pointerId=null;

  let startPointerX=0;
  let startPointerY=0;

  let startX=0;
  let startY=0;

  let lastX=0;
  let lastY=0;

  let velocityX=0;
  let velocityY=0;

  let moved=false;

  card.addEventListener(
    'pointerdown',
    e=>{

      const p=
        positions.get(id);

      if(!p)
        return;

      pointerId=
        e.pointerId;

      card.setPointerCapture(
        pointerId
      );

      startPointerX=
        e.clientX;

      startPointerY=
        e.clientY;

      startX=p.x;
      startY=p.y;

      lastX=e.clientX;
      lastY=e.clientY;

      velocityX=0;
      velocityY=0;

      moved=false;

      drag={
        id:id
      };

      card.classList.add(
        'dragging'
      );

    },
    {
      passive:true
    }
  );

  card.addEventListener(
    'pointermove',
    e=>{

      if(
        pointerId!==
        e.pointerId
      )
        return;

      if(
        !drag ||
        drag.id!==id
      )
        return;

      const p=
        positions.get(id);

      if(!p)
        return;

      const dx=
        e.clientX-
        startPointerX;

      const dy=
        e.clientY-
        startPointerY;

      if(
        Math.abs(dx)>3 ||
        Math.abs(dy)>3
      ){

        moved=true;

      }

      p.x=
        startX+
        dx;

      p.y=
        startY+
        dy;

      clampPosition(p);

      velocityX=
        velocityX*.55+
        (
          e.clientX-
          lastX
        )*.45;

      velocityY=
        velocityY*.55+
        (
          e.clientY-
          lastY
        )*.45;

      lastX=e.clientX;
      lastY=e.clientY;

      p.rotation=
        Math.max(
          -7,
          Math.min(
            7,
            velocityX*.7
          )
        );

      pushNeighbors(
        id,
        velocityX,
        velocityY
      );

      applyPosition(id);

    },
    {
      passive:true
    }
  );

  function release(e){

    if(
      pointerId!==
      e.pointerId
    )
      return;

    pointerId=null;

    const p=
      positions.get(id);

    if(p){

      p.vx+=
        velocityX*.45;

      p.vy+=
        velocityY*.45;

      p.homeX=
        p.x;

      p.homeY=
        p.y;

      p.rotation=0;

    }

    card.classList.remove(
      'dragging'
    );

    const wasClick=
      !moved;

    drag=null;

    if(wasClick){

      openPopup(id);

    }

  }

  card.addEventListener(
    'pointerup',
    release
  );

  card.addEventListener(
    'pointercancel',
    release
  );

}


/* =====================================================
   PUSH NEIGHBORS
===================================================== */

function pushNeighbors(
  movingId,
  vx,
  vy
){

  const moving=
    positions.get(
      movingId
    );

  if(!moving)
    return;

  positions.forEach(
    (other,id)=>{

      if(
        id===
        movingId
      )
        return;

      const dx=
        (
          other.x+
          other.size/2
        )-
        (
          moving.x+
          moving.size/2
        );

      const dy=
        (
          other.y+
          other.size/2
        )-
        (
          moving.y+
          moving.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          moving.size/2+
          other.size/2
        )*.92;

      if(
        distance<
        minimum
      ){

        const d=
          Math.max(
            distance,
            .001
          );

        const nx=
          dx/d;

        const ny=
          dy/d;

        const overlap=
          minimum-distance;

        const speed=
          Math.min(
            13,
            Math.sqrt(
              vx*vx+
              vy*vy
            )
          );

        const impulse=
          overlap*.95+
          speed*.42;

        other.vx+=
          nx*
          impulse;

        other.vy+=
          ny*
          impulse;

        other.rotation+=
          nx*
          impulse*
          .7;

        other.vx=
          Math.max(
            -8,
            Math.min(
              8,
              other.vx
            )
          );

        other.vy=
          Math.max(
            -8,
            Math.min(
              8,
              other.vy
            )
          );

        other.homeX+=
          nx*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        other.homeY+=
          ny*
          Math.min(
            11,
            overlap+
            speed*.65
          );

        clampPosition(
          other
        );

      }

    }
  );

}


/* =====================================================
   FLOATING PHYSICS
===================================================== */

const __appEl=document.querySelector('.app');
function animate(){

  if(__appEl.classList.contains('listMode')||document.body.classList.contains('introOn')||pageMenu.classList.contains('show')||document.querySelector('.overlay.show,.qrOverlay.show')){requestAnimationFrame(animate);return;}

  const now=
    performance.now();

  positions.forEach(
    (p,id)=>{

      const held=
        drag &&
        drag.id===
        id;

      if(!held){

        const fx=
          Math.sin(
            now*
            p.speedX+
            p.phaseX
          )*
          p.amplitudeX;

        const fy=
          Math.cos(
            now*
            p.speedY+
            p.phaseY
          )*
          p.amplitudeY;

        const targetX=
          p.homeX+
          fx;

        const targetY=
          p.homeY+
          fy;

        p.vx+=
          (
            targetX-
            p.x
          )*.012;

        p.vy+=
          (
            targetY-
            p.y
          )*.012;

        p.vx*=.93;
        p.vy*=.93;

        p.x+=p.vx;
        p.y+=p.vy;

        p.rotation=
          Math.sin(
            now*
            p.rotSpeed+
            p.phaseX
          )*2.2;

      }

      bounceFromEdges(p);

      clampPosition(p);

      applyPosition(id);

    }
  );

  collisionPhysics();

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   COLLISION
===================================================== */

function collisionPhysics(){

  const ids=
    Array.from(
      positions.keys()
    );

  for(
    let i=0;
    i<ids.length;
    i++
  ){

    const a=
      positions.get(
        ids[i]
      );

    if(!a)
      continue;

    for(
      let j=i+1;
      j<ids.length;
      j++
    ){

      const b=
        positions.get(
          ids[j]
        );

      if(!b)
        continue;

      const dx=
        (
          b.x+
          b.size/2
        )-
        (
          a.x+
          a.size/2
        );

      const dy=
        (
          b.y+
          b.size/2
        )-
        (
          a.y+
          a.size/2
        );

      const distance=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      const minimum=
        (
          a.size/2+
          b.size/2
        )*.82;

      if(
        distance<
        minimum &&
        distance>.001
      ){

        const nx=
          dx/
          distance;

        const ny=
          dy/
          distance;

        const overlap=
          minimum-
          distance;

        const push=
          overlap*.045;

        a.x-=
          nx*
          push;

        a.y-=
          ny*
          push;

        b.x+=
          nx*
          push;

        b.y+=
          ny*
          push;

        const bounce=
          .008;

        a.vx-=
          nx*
          bounce;

        a.vy-=
          ny*
          bounce;

        b.vx+=
          nx*
          bounce;

        b.vy+=
          ny*
          bounce;

        clampPosition(a);
        clampPosition(b);

      }

    }

  }

}


/* =====================================================
   POPUP
===================================================== */

function setChange(
  id,
  value
){

  const el=
    document.getElementById(
      id
    );

  if(!el)
    return;

  el.textContent=
    percent(value);

  el.style.color=
    Number(value)>=0
      ?'#7dfa00'
      :'#fb038d';

}


function updatePopup(
  stock
){

  const gain=
    Number(
      stock.price_change_percentage_24h
    )||0;

  document.getElementById(
    'pPrice'
  ).textContent=
    price(
      stock.current_price
    );

  const gainEl=
    document.getElementById(
      'pGain'
    );

  gainEl.textContent=
    percent(gain);

  gainEl.className=
    'popupGain '+
    (
      gain>=0
        ?'up'
        :'down'
    );

  setChange(
    'twentyFourH',
    stock.price_change_percentage_24h
  );

}


function openPopup(id){

  const stock=
    stockMap.get(id);

  if(!stock)
    return;

  selectedStock=
    stock;

  const favoriteStar=document.getElementById('favoriteStar');
  if(favoriteStar){
    favoriteStar.classList.toggle('active', localStorage.getItem('fav_'+stock.id)==='1');
    favoriteStar.dataset.stockId=stock.id;
  }

  setReliableLogo(document.getElementById('pLogo'),stock.symbol);

  document.getElementById(
    'pName'
  ).textContent=
    stock.name;

  document.getElementById(
    'pSymbol'
  ).textContent=
    stock.symbol;

  updatePopup(
    stock
  );

  document.getElementById(
    'marketCap'
  ).textContent=
    large(
      stock.market_cap
    );

  document.getElementById(
    'volume'
  ).textContent=
    large(
      stock.total_volume
    );

  document.getElementById(
    'high'
  ).textContent=
    price(
      stock.high_24h
    );

  document.getElementById(
    'low'
  ).textContent=
    price(
      stock.low_24h
    );

  document.getElementById(
    'rank'
  ).textContent=
    stock.market_cap_rank
      ?'#'+stock.market_cap_rank
      :'—';

  document.getElementById(
    'supply'
  ).textContent=
    supply(
      stock.circulating_supply
    );

  document.getElementById(
    'totalSupply'
  ).textContent=
    supply(
      stock.total_supply
    );

  document.getElementById(
    'maxSupply'
  ).textContent=
    supply(
      stock.max_supply
    );

  document.getElementById(
    'ath'
  ).textContent=
    price(
      stock.ath
    );

  document.getElementById(
    'atl'
  ).textContent=
    price(
      stock.atl
    );

  setChange(
    'oneH',
    stock.price_change_percentage_1h_in_currency
  );

  document.getElementById(
    'overlay'
  ).classList.add(
    'show'
  );

}


document.getElementById('favoriteStar').addEventListener('click',()=>{
  if(!selectedStock)return;
  const key='fav_'+selectedStock.id;
  const isFav=localStorage.getItem(key)==='1';
  localStorage.setItem(key,isFav?'0':'1');
  document.getElementById('favoriteStar').classList.toggle('active',!isFav);
});

/* =====================================================
   CLOSE POPUP
===================================================== */

function closePopup(){

  document.getElementById(
    'overlay'
  ).classList.remove(
    'show'
  );

  selectedStock=null;

}


document.getElementById(
  'close'
).addEventListener(
  'click',
  closePopup
);


let popupOpenedAt=0;
(function(){const _op=openPopup;openPopup=function(id){popupOpenedAt=Date.now();return _op(id);};})();
document.getElementById('overlay').addEventListener('click',e=>{
  if(Date.now()-popupOpenedAt<350)return;
  if(e.target.closest&&e.target.closest('.popupAction,.favoriteStar'))return;
  closePopup();
});


/* =====================================================
   TRADINGVIEW
===================================================== */

function openTradingView(){
  if(!selectedStock)return;
  const symbol=selectedStock.symbol.toUpperCase();
  const tvSymbol=selectedStock.tv_symbol||('NASDAQ:'+symbol);
  const parts=tvSymbol.split(':');
  const exchange=parts.length>1?parts[0]:'NASDAQ';
  const ticker=parts.length>1?parts.slice(1).join(':'):parts[0];
  const url='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(exchange+':'+ticker);
  window.open(url,'_blank');
}

function openStockLink(type){
  if(!selectedStock)return;
  const symbol=selectedStock.symbol.toUpperCase();
  const name=encodeURIComponent(selectedStock.name||symbol);
  let url='';
  if(type==='explorer'){
    url='https://www.nasdaq.com/market-activity/stocks/'+encodeURIComponent(symbol.toLowerCase());
  }else if(type==='website'){
    url='https://www.google.com/search?q='+encodeURIComponent(symbol+' '+(selectedStock.name||'')+' official company website');
  }
  if(url)window.open(url,'_blank');
}


/* Hitung ulang ukuran layar saat kembali dari chart/tab lain (viewport bisa telat berubah) */
(function(){
  let lastH=innerHeight,lastW=innerWidth,t=0;
  window.addEventListener('resize',()=>{lastH=innerHeight;lastW=innerWidth;});
  const check=()=>{
    if(innerHeight!==lastH||innerWidth!==lastW){lastH=innerHeight;lastW=innerWidth;window.dispatchEvent(new Event('resize'));}
  };
  const kick=()=>{check();clearTimeout(t);t=setTimeout(check,150);setTimeout(check,500);};
  window.addEventListener('pageshow',kick);
  window.addEventListener('focus',kick);
  window.addEventListener('orientationchange',kick);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)kick();});
  if(window.visualViewport)visualViewport.addEventListener('resize',check);
})();

document.getElementById('tradingViewIcon').addEventListener('click',openTradingView);
document.getElementById('blockExplorer').addEventListener('click',()=>openStockLink('explorer'));
document.getElementById('coinWebsite').addEventListener('click',()=>openStockLink('website'));

/* ===== INTRO: slide to enter + back navigation berlapis ===== */
(function(){
  const intro=document.getElementById('intro'), slide=document.getElementById('slide'),
        thumb=document.getElementById('slideThumb'), fill=document.getElementById('slideFill'),
        text=slide.querySelector('.slideText');
  const PAD=5, SZ=54;
  let dragging=false, startX=0, pos=0, max=0;
  const setPos=x=>{pos=Math.max(0,Math.min(max,x));thumb.style.transform='translateX('+pos+'px)';fill.style.width=(pos+SZ+PAD*2-4)+'px';const p=max?pos/max:0;text.style.opacity=String(Math.max(0,1-p*1.6));thumb.setAttribute('aria-valuenow',Math.round(p*100));};
  const measure=()=>{max=slide.clientWidth-SZ-PAD*2;};
  const reset=()=>{slide.classList.remove('done');slide.classList.add('snap');measure();setPos(0);setTimeout(()=>slide.classList.remove('snap'),320);};

  function showIntro(){
    document.body.classList.add('introOn');
    intro.classList.remove('hidden');
    void intro.offsetWidth;
    intro.classList.remove('gone');
    reset();
  }
  function unlock(){
    slide.classList.add('snap','done');measure();setPos(max);
    try{navigator.vibrate&&navigator.vibrate(30);}catch(e){}
    setTimeout(()=>{
      intro.classList.add('gone');
      document.body.classList.remove('introOn');
      if(history.state&&history.state.s==='intro')history.pushState({s:'app',n:0},'');
      setTimeout(()=>{if(intro.classList.contains('gone'))intro.classList.add('hidden');},380);
    },220);
  }
  thumb.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX-pos;measure();slide.classList.remove('snap');thumb.setPointerCapture(e.pointerId);e.preventDefault();});
  thumb.addEventListener('pointermove',e=>{if(dragging)setPos(e.clientX-startX);});
  const end=()=>{if(!dragging)return;dragging=false;if(max&&pos/max>=.85)unlock();else{slide.classList.add('snap');setPos(0);}};
  thumb.addEventListener('pointerup',end);
  thumb.addEventListener('pointercancel',end);
  thumb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();unlock();}});
  window.addEventListener('resize',()=>{measure();if(!slide.classList.contains('done'))setPos(0);});
  measure();setPos(0);

  /* ---- riwayat back: intro -> app -> lapisan (menu / pop up saham / QR) ---- */
  const layerEls=[document.getElementById('overlay'),document.getElementById('qrOverlay'),document.getElementById('pageMenu'),document.getElementById('newsPanel')];
  const closeEl=el=>{
    if(el.id==='overlay'&&typeof closePopup==='function')closePopup();
    else if(el.id==='pageMenu'&&typeof setMenuOpen==='function')setMenuOpen(false);
    else el.classList.remove('show');
  };
  let hist=[], skip=0;
  /* ---- kembali dari link luar (chart/web/explorer): lanjut ke list/bubble terakhir, bukan intro ---- */
  const AWAY_KEY='usf_away';
  let away=null;
  try{const raw=localStorage.getItem(AWAY_KEY);if(raw){const o=JSON.parse(raw);if(o&&Date.now()-o.ts<15*60*1000)away=o;localStorage.removeItem(AWAY_KEY);}}catch(e){}
  const saveAway=()=>{
    try{
      const sl=document.getElementById('stockList');
      localStorage.setItem(AWAY_KEY,JSON.stringify({ts:Date.now(),mode:viewMode,ids:visibleStocks.map(c=>c.id),listSource,listRankStart,listSort,activeTimeFrame,scroll:sl?sl.scrollTop:0}));
    }catch(e){}
  };
  const _wo=window.open.bind(window);
  window.open=function(){saveAway();return _wo.apply(window,arguments);};
  window.addEventListener('pageshow',e=>{if(e.persisted){try{localStorage.removeItem(AWAY_KEY);}catch(x){}}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{localStorage.removeItem(AWAY_KEY);}catch(x){}}});
  window.__restoreAway=function(){
    if(!away)return;
    const st=away;away=null;
    try{
      const m=new Map(allStocks.map(c=>[c.id,c]));
      const vs=(st.ids||[]).map(id=>m.get(id)).filter(Boolean);
      listSource=st.listSource||'own';listRankStart=st.listRankStart||1;listSort=st.listSort||'marketcap';activeTimeFrame=st.activeTimeFrame||activeTimeFrame;
      if(vs.length){visibleStocks=vs;cloud.innerHTML='';nodes.clear();createPositions();visibleStocks.forEach(c=>cloud.appendChild(createStock(c)));}
      const rl=document.getElementById('listRankLabel');if(rl&&listSource==='own')rl.textContent=listRankStart+' – '+(listRankStart+99);
      const sl=document.getElementById('listSortLabel');if(sl&&listSource==='own'&&SORT_LABELS[listSort])sl.textContent=SORT_LABELS[listSort];
      setViewMode(st.mode||'bubble');
      const sc=document.getElementById('stockList');if(sc&&st.scroll)requestAnimationFrame(()=>{sc.scrollTop=st.scroll;});
    }catch(e){console.warn('restore failed',e);}
  };
  if(away){
    intro.classList.add('hidden');document.body.classList.remove('introOn');
    history.replaceState({s:'app',n:0},'');
  }else{
    history.replaceState({s:'intro'},'');
  }
  const obs=new MutationObserver(ms=>{
    ms.forEach(m=>{
      const el=m.target, on=el.classList.contains('show'), idx=hist.indexOf(el);
      if(on&&idx<0){hist.push(el);history.pushState({s:'app',n:hist.length},'');}
      else if(!on&&idx>=0){
        hist[idx]=null;
        let k=0;while(hist.length&&hist[hist.length-1]===null){hist.pop();k++;}
        if(k){skip++;history.go(-k);}
      }
    });
  });
  layerEls.forEach(el=>el&&obs.observe(el,{attributes:true,attributeFilter:['class']}));
  window.addEventListener('popstate',()=>{
    if(skip>0){skip--;return;}
    const st=history.state||{};
    if(st.s==='intro'){
      const old=hist.slice();hist=[];
      old.forEach(e=>e&&closeEl(e));
      showIntro();
      return;
    }
    if(!intro.classList.contains('hidden')&&!intro.classList.contains('gone')){
      intro.classList.add('hidden');document.body.classList.remove('introOn');
    }
    const d=st.n||0;
    while(hist.length>d){const e=hist.pop();if(e)closeEl(e);}
    if(d>hist.length){history.replaceState({s:'app',n:hist.length},'');return;}
    if(d>0&&hist[d-1]===null){
      let k=0;while(hist.length&&hist[hist.length-1]===null){hist.pop();k++;}
      if(k){skip++;history.go(-k);}
    }
  });
})();
</script>


<script>
/* =====================================================
   NEWS: US stock market news (Nasdaq, NYSE, Wall Street)
   Sources: CNBC, Nasdaq, MarketWatch
===================================================== */
(function(){
  const panel=document.getElementById('newsPanel');
  if(!panel)return;
  const listEl=document.getElementById('newsList'), tabsEl=document.getElementById('newsTabs');
  const subEl=document.getElementById('newsSub'), btnR=document.getElementById('newsRefresh'), btnC=document.getElementById('newsClose');
  const menuEl=document.getElementById('pageMenu'), backdropEl=document.getElementById('menuBackdrop');

  const GN=q=>'https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-US&gl=US&ceid=US:en';
  const NQ=c=>'https://www.nasdaq.com/feed/rssoutbound?category='+c;
  const CNBC=id=>'https://www.cnbc.com/id/'+id+'/device/rss/rss.html';
  const F={
    cnbc:[{name:'CNBC',url:CNBC(10000664)},{name:'CNBC',url:CNBC(15839069)},{name:'CNBC',url:CNBC(100003114)}],
    nasdaq:[{name:'Nasdaq',url:NQ('Markets')},{name:'Nasdaq',url:NQ('Stocks')},{name:'Nasdaq',url:NQ('Earnings')}],
    mw:[{name:'MarketWatch',url:'https://feeds.content.dowjones.io/public/rss/mw_topstories'},{name:'MarketWatch',url:'https://feeds.content.dowjones.io/public/rss/mw_marketpulse'}]
  };
  const TABS=[
    {k:'all',label:'All',feeds:[].concat(F.cnbc.slice(0,2),F.nasdaq.slice(0,2),F.mw)},
    {k:'cnbc',label:'CNBC',feeds:F.cnbc},
    {k:'nasdaq',label:'Nasdaq',feeds:F.nasdaq},
    {k:'mw',label:'MarketWatch',feeds:F.mw}
  ];

  const TTL=10*60*1000;              // data is considered fresh for 10 minutes
  const KEY='usf_news_v3';
  try{localStorage.removeItem('usf_news_v2');}catch(e){}
  let cur='all', built=false, reqId=0, cache={};
  try{const raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&typeof raw==='object')cache=raw;}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(cache));}catch(e){}}
  const isOpen=()=>panel.classList.contains('show');

  function parseDate(v){
    if(!v)return 0;
    if(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(v))return Date.parse(v.replace(' ','T')+'Z')||0;
    return Date.parse(v)||0;
  }
  function plain(h){
    if(!h)return '';
    try{return (new DOMParser().parseFromString(h,'text/html').body.textContent||'').replace(/\s+/g,' ').trim();}catch(e){return '';}
  }
  function ago(ts){
    if(!ts)return '';
    const m=Math.floor(Math.max(0,Date.now()-ts)/6e4);
    if(m<1)return 'just now';
    if(m<60)return m+'m ago';
    const h=Math.floor(m/60);
    if(h<24)return h+'h ago';
    const d=Math.floor(h/24);
    if(d===1)return 'yesterday';
    if(d<7)return d+'d ago';
    return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function withTimeout(url,ms){
    const c=new AbortController(), t=setTimeout(()=>c.abort(),ms);
    return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t));
  }
  async function viaRss2Json(url){
    const r=await withTimeout('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url),10000);
    if(!r.ok)throw new Error('http');
    const j=await r.json();
    if(j.status!=='ok'||!Array.isArray(j.items))throw new Error('bad');
    return j.items.map(i=>({title:i.title,link:i.link,ts:parseDate(i.pubDate),desc:i.description}));
  }
  async function viaProxy(url){
    const r=await withTimeout('https://api.allorigins.win/raw?url='+encodeURIComponent(url),10000);
    if(!r.ok)throw new Error('http');
    const x=new DOMParser().parseFromString(await r.text(),'text/xml');
    const g=(n,t)=>{const e=n.getElementsByTagName(t)[0];return e?e.textContent:'';};
    const items=[...x.getElementsByTagName('item')].map(n=>({title:g(n,'title'),link:g(n,'link'),ts:parseDate(g(n,'pubDate')),desc:g(n,'description')}));
    if(!items.length)throw new Error('empty');
    return items;
  }
  async function fetchFeed(f){
    let items;
    try{items=await viaRss2Json(f.url);}catch(e){items=await viaProxy(f.url);}
    return items.slice(0,15).map(i=>{
      let title=plain(i.title), source=f.name, desc=plain(i.desc);
      if(f.gn){
        const k=title.lastIndexOf(' - ');
        if(k>10){source=title.slice(k+3);title=title.slice(0,k);}
        desc='';
      }
      if(desc&&(desc===title||desc.indexOf(title)===0))desc='';
      if(desc.length>160)desc=desc.slice(0,157).replace(/\s+\S*$/,'')+'…';
      return {title,link:i.link,ts:i.ts,source,desc};
    }).filter(i=>i.title&&/^https?:\/\//i.test(i.link||''));
  }
  async function fetchTab(k){
    const tab=TABS.find(t=>t.k===k);
    const res=await Promise.allSettled(tab.feeds.map(fetchFeed));
    const seen=new Set(), out=[];
    res.forEach(r=>{if(r.status==='fulfilled')r.value.forEach(i=>{
      const key=i.title.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
      if(seen.has(key))return;seen.add(key);out.push(i);
    });});
    if(!out.length)throw new Error('none');
    out.sort((a,b)=>b.ts-a.ts);
    cache[k]={t:Date.now(),items:out.slice(0,60)};
    persist();
    return cache[k];
  }

  function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function showSkeleton(){
    listEl.innerHTML='';
    for(let n=0;n<7;n++){const s=el('div','newsSk');s.appendChild(el('i'));s.appendChild(el('i'));s.appendChild(el('i'));listEl.appendChild(s);}
  }
  function showError(){
    listEl.innerHTML='';
    const b=el('div','newsState','Could not load the news. Check your connection and try again.');
    const r=el('button',null,'Try again');r.type='button';r.onclick=()=>show(cur,true);
    b.appendChild(document.createElement('br'));b.appendChild(r);listEl.appendChild(b);
    subEl.textContent='Failed to load';
  }
  function render(items,keepScroll){
    const top=listEl.scrollTop;
    listEl.innerHTML='';
    const frag=document.createDocumentFragment();
    items.forEach(i=>{
      const b=el('button','newsItem');b.type='button';
      const meta=el('div','newsMeta');
      meta.appendChild(el('span','newsSrc',i.source));
      const t=ago(i.ts);if(t){meta.appendChild(el('span',null,'·'));meta.appendChild(el('span',null,t));}
      b.appendChild(meta);
      b.appendChild(el('div','newsHl',i.title));
      if(i.desc)b.appendChild(el('div','newsDesc',i.desc));
      b.onclick=()=>{window.open(i.link,'_blank','noopener');};
      frag.appendChild(b);
    });
    listEl.appendChild(frag);
    listEl.scrollTop=keepScroll?top:0;
  }
  function setSub(t,note){
    const d=new Date(t);
    subEl.textContent=(note||'US sources · updated ')+(note?'':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
  }
  // stale-while-revalidate: show saved news instantly, refresh only when older than 10 minutes
  async function show(k,force,silent){
    cur=k;
    tabsEl.querySelectorAll('.newsTab').forEach(b=>b.classList.toggle('active',b.dataset.k===k));
    const id=++reqId, c=cache[k];
    if(c&&!silent){render(c.items);setSub(c.t);}
    if(c&&!force&&Date.now()-c.t<TTL)return;
    if(!c&&!silent){showSkeleton();subEl.textContent='Loading news…';}
    btnR.classList.add('spin');
    try{
      const fresh=await fetchTab(k);
      if(id===reqId&&isOpen()&&cur===k){render(fresh.items,!!c);setSub(fresh.t);}
    }catch(e){
      if(id===reqId&&isOpen()){
        if(!c)showError();
        else setSub(c.t,'Update failed · showing saved news');
      }
    }finally{
      if(id===reqId)btnR.classList.remove('spin');
    }
  }
  function build(){
    if(built)return;built=true;
    TABS.forEach(t=>{
      const b=el('button','newsTab',t.label);b.type='button';b.dataset.k=t.k;
      b.onclick=()=>{
        if(t.k!==cur)show(t.k);else listEl.scrollTop=0;
        b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
      };
      tabsEl.appendChild(b);
    });
  }

  // News sits on top of the pop-up menu; Back returns to the menu instead of exiting the app.
  window.openNews=function(){
    build();
    menuEl.classList.add('underNews');
    if(backdropEl)backdropEl.classList.add('underNews');
    panel.classList.add('show');
    show(cur);
  };
  new MutationObserver(()=>{
    if(!isOpen()){
      menuEl.classList.remove('underNews');
      if(backdropEl)backdropEl.classList.remove('underNews');
    }
  }).observe(panel,{attributes:true,attributeFilter:['class']});
  const goBack=()=>{
    if(history.state&&history.state.n>=1)history.back();
    else panel.classList.remove('show');
  };
  btnC.onclick=goBack;
  btnR.onclick=()=>show(cur,true);
  // tapping the floating menu button while news is open also goes back to the menu
  document.addEventListener('click',e=>{
    if(isOpen()&&e.target.closest&&e.target.closest('#pageButton')){e.stopPropagation();e.preventDefault();goBack();}
  },true);

  // automatic update every 10 minutes (only while the app is visible)
  setInterval(()=>{if(!document.hidden)show(cur,true,!isOpen()?true:false);},TTL);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&isOpen()){const c=cache[cur];if(!c||Date.now()-c.t>=TTL)show(cur,true,true);}
  });
})();
</script>
